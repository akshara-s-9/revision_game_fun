<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazardous Earth — GCSE Geography Expedition</title>
<style>
/* ============================================================
   THEME — the palette is the Earth in cross-section:
   upper atmosphere, storm band, surface, crust, mantle.
   ============================================================ */
:root{
  --ink:#120826;
  --void:#1b0f38;

  --sky-1:#3a1f7d;      /* upper atmosphere */
  --sky-2:#5b3fd6;      /* mid sky          */
  --sky-3:#7d5eea;      /* lower sky        */
  --cyan:#3fd3ef;       /* storm band       */
  --cloud:#efe6ff;

  --grass:#57cc4a;
  --grass-2:#2f8f36;
  --soil:#8a4b2c;
  --rock:#5c3320;
  --rock-2:#3a1f13;
  --mantle:#c8391c;
  --magma:#ff9a2e;

  --gold:#ffc63c;
  --tok:#2ee6c2;
  --good:#3fd97f;
  --bad:#ff5a4a;

  --chrome:#cfcbe0;     /* window face */
  --chrome-hi:#ffffff;
  --chrome-lo:#8a86a3;
  --paper:#f6f2ff;

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

  --shadow:0 18px 50px rgba(0,0,0,.55);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink);
  background-image:
    radial-gradient(900px 500px at 78% -12%, rgba(91,63,214,.55), transparent 70%),
    radial-gradient(700px 420px at 8% 108%, rgba(200,57,28,.28), transparent 70%);
  color:#eee7ff;
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 56px}

/* ============================================================
   THE WINDOW — the whole game sits in one chunky desktop window,
   with the nine specification topics as its folder tabs.
   ============================================================ */
.tabs{display:flex;gap:3px;overflow-x:auto;padding:0 6px;scrollbar-width:thin}
.tab{
  flex:0 0 auto;position:relative;top:3px;
  padding:7px 12px 9px;background:#2a1c50;color:#8f83bd;
  border:3px solid var(--ink);border-bottom:0;
  font:600 11.5px/1.2 var(--mono);letter-spacing:.02em;white-space:nowrap;
}
.tab .n{color:#6f63a0;margin-right:6px}
.tab.live{
  top:0;background:var(--chrome);color:var(--ink);padding-bottom:12px;
  box-shadow:inset 3px 3px 0 var(--chrome-hi);
}
.tab.live .n{color:#6a4fd8}
.tab.locked{cursor:not-allowed}

.win{
  background:var(--chrome);
  border:3px solid var(--ink);
  box-shadow:10px 10px 0 rgba(10,4,24,.55);
}
.titlebar{
  display:flex;align-items:center;gap:12px;
  padding:7px 8px 7px 12px;
  background:linear-gradient(90deg,#6a4fd8,#b34fd8 60%,#3fd3ef);
  border-bottom:3px solid var(--ink);
  color:#fff;
}
.titlebar .tt{font:700 14px/1 var(--mono);letter-spacing:.14em;text-shadow:2px 2px 0 rgba(18,8,38,.55)}
.titlebar .tsub{font:11.5px/1 var(--mono);color:rgba(255,255,255,.82);margin-right:auto}
.winbtn{
  width:26px;height:22px;background:var(--chrome);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--chrome-lo),inset 2px 2px 0 var(--chrome-hi);
  color:var(--ink);font:700 12px/1 var(--mono);display:grid;place-items:center;
}
.winbtn:hover{background:#e6e2f5}
.winbtn:active{box-shadow:inset 2px 2px 0 var(--chrome-lo)}

/* ---- status strip ---- */
.status{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:3px solid var(--ink);
  background:#bdb8d4;font:12px/1.3 var(--mono);color:#2a1f4d;
}
.gauge{
  display:flex;align-items:center;gap:8px;padding:5px 12px;
  background:var(--ink);border:2px solid #000;color:var(--gold);
  box-shadow:inset -2px -2px 0 rgba(255,255,255,.12);
}
.gauge .gem{font-size:14px}
.gauge .n{font:700 17px/1 var(--mono);font-variant-numeric:tabular-nums;color:#fff}
.status .counts{display:flex;gap:14px;flex-wrap:wrap}
.status .counts b{font-weight:700}
.status .note{margin-left:auto;padding:5px 10px;background:#a9a3c6;border:2px solid var(--ink)}
.status .note.ready{background:var(--gold);color:#3b2600}

/* ============================================================
   THE COURSE — a scrolling cross-section of the hazardous Earth
   ============================================================ */
.stage{
  position:relative;overflow:hidden;
  border-bottom:3px solid var(--ink);
  background:#2a1a55;touch-action:pan-y;
}
canvas#world{
  display:block;width:100%;height:448px;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.stage:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}

/* depth ruler — height on screen is altitude, so say so */
.ruler{position:absolute;left:0;top:0;bottom:0;width:104px;pointer-events:none}
.ruler span{
  position:absolute;left:6px;transform:translateY(-50%);
  padding:2px 6px;background:rgba(18,8,38,.66);
  font:600 9.5px/1.4 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.62);
}

/* signposts, positioned over the world in world coordinates */
.markers{position:absolute;inset:0;pointer-events:none}
.mark{
  position:absolute;pointer-events:auto;transform:translate(-50%,-100%);
  min-width:104px;max-width:190px;padding:5px 8px 6px;text-align:left;
  background:var(--chrome);border:3px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--chrome-lo),inset 2px 2px 0 var(--chrome-hi),0 4px 0 rgba(18,8,38,.5);
  transition:transform .08s steps(2);
}
.mark .r{display:block;font:700 10px/1.3 var(--mono);color:#6a4fd8;letter-spacing:.08em}
.mark .l{display:block;font:600 12px/1.25 var(--sans);color:var(--ink);margin-top:1px}
.mark .s{display:block;font:10.5px/1.3 var(--mono);color:#5c5480;margin-top:3px}
.mark:hover{transform:translate(-50%,-100%) translateY(-3px)}
.mark.done{background:#d6f5e0;border-color:#0d4f2c}
.mark.done .r{color:#0d7a44}
.mark.done .s{color:#0d7a44}
.mark.near{background:var(--gold);border-color:#5a3c00}
.mark.near .r,.mark.near .s{color:#6b4a00}
.mark.locked{background:#a49ec2;cursor:not-allowed;box-shadow:none;opacity:.9}
.mark.locked .l{color:#3b3358}
.mark.locked .r{color:#4b4270}
.mark[data-kind="finale"]{min-width:132px}
.mark .pip{display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--pair);vertical-align:1px}

/* ---- controls ---- */
.ctrl{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;background:#bdb8d4;border-bottom:3px solid var(--ink);
  font:11.5px/1.5 var(--mono);color:#3a3060;
}
.ctrl kbd{
  display:inline-block;min-width:20px;padding:1px 5px;margin:0 1px;text-align:center;
  background:var(--chrome);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--chrome-lo),inset 2px 2px 0 var(--chrome-hi);
  font:700 11px/1.4 var(--mono);color:var(--ink);
}
.ctrl .sp{margin-left:auto}
.pad{position:absolute;left:10px;bottom:10px;display:none;gap:8px}
.pad button{
  width:56px;height:56px;background:rgba(207,203,224,.92);border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 var(--chrome-lo),inset 3px 3px 0 var(--chrome-hi);
  color:var(--ink);font:700 20px/1 var(--mono);
}
.pad button:active{box-shadow:inset 3px 3px 0 var(--chrome-lo)}
body.touch .pad{display:flex}

/* ============================================================
   COURSE INDEX — every stop in specification order, as a list
   that works without the platformer
   ============================================================ */
.index{padding:16px 14px 4px;background:var(--chrome);color:var(--ink)}
.idxhead{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin:14px 0 4px;padding-bottom:5px;border-bottom:3px solid var(--ink);
}
.idxhead:first-child{margin-top:0}
.idxhead h3{font:700 12px/1 var(--mono);letter-spacing:.12em}
.idxhead .sub{font:12px/1.4 var(--sans);color:#5c5480}
.row{
  display:flex;width:100%;align-items:center;gap:12px;text-align:left;
  padding:9px 10px;border-bottom:1px solid #b4aecf;
  border-left:5px solid transparent;
}
.row:hover:not(:disabled){background:#e2ddf2;border-left-color:#6a4fd8}
.row.done{border-left-color:var(--grass-2)}
.row.done:hover{border-left-color:var(--grass-2)}
.row .ref{flex:0 0 40px;font:700 12px/1 var(--mono);color:#6a4fd8;font-variant-numeric:tabular-nums}
.row .nm{flex:1 1 auto;min-width:0}
.row .nm b{display:block;font:600 14px/1.3 var(--sans)}
.row .nm i{display:block;font:normal 12.5px/1.4 var(--sans);color:#5c5480;margin-top:1px}
.row .st{flex:0 0 auto;font:11.5px/1 var(--mono);color:#5c5480;text-align:right;white-space:nowrap}
.row.done .st{color:#0d7a44;font-weight:700}
.row:disabled{opacity:.55;cursor:not-allowed}
.row .pip{flex:0 0 10px;height:10px;background:var(--pair)}
.row .locked{color:#6b628f}

/* ============================================================
   FINALE CARD
   ============================================================ */
.finale{
  margin:0;padding:16px 14px 18px;background:#bdb8d4;
  border-top:3px solid var(--ink);color:var(--ink);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.finale.ready{background:linear-gradient(90deg,var(--gold),#ffa93c)}
.finale .ft{margin-right:auto;flex:1 1 340px}
.finale h3{font:700 13px/1.3 var(--mono);letter-spacing:.08em}
.finale p{margin:6px 0 0;font:13px/1.55 var(--sans);color:#3a3060;max-width:62ch}
.finale.ready p{color:#4a3200}
.bar{height:14px;background:var(--ink);border:2px solid #000;margin-top:10px;max-width:340px;padding:2px}
.bar>i{display:block;height:100%;background:var(--tok);transition:width .4s steps(12)}
.finale.ready .bar>i{background:var(--good)}

/* the one button that starts the finale */
.btn{
  padding:9px 16px;background:var(--chrome);border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 var(--chrome-lo),inset 3px 3px 0 var(--chrome-hi);
  font:600 13px/1.3 var(--sans);color:var(--ink);
}
.btn:hover:not(:disabled){background:#e2ddf2}
.btn:active:not(:disabled){box-shadow:inset 3px 3px 0 var(--chrome-lo)}
.btn.primary{background:var(--tok);color:#04322a}
.btn.primary:hover:not(:disabled){background:#5cf2d6}
.btn.ghost{background:transparent;box-shadow:none;border-color:rgba(18,8,38,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============================================================
   MODAL
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(4,8,17,.78);backdrop-filter:blur(5px);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;
  overflow-y:auto;z-index:50;
}
.scrim[hidden]{display:none}
.modal{
  width:min(760px,100%);background:var(--bg-2);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--panel)}
.mhead .loc{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.mhead h2{font-size:16px;margin-top:2px}
.mhead .prog{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.mfoot .sp{margin-left:auto}
.x{font-size:20px;color:var(--dim);line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--ink);background:var(--edge-soft)}

.qtype{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.qtext{font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;padding:12px 15px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--edge);background:var(--panel-2)}
.opt.correct{border-color:var(--good);background:rgba(79,220,149,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,111,94,.12)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;width:22px;color:var(--dim);font-weight:600}

.fb{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.5}
.fb.ok{background:rgba(79,220,149,.10);border:1px solid rgba(79,220,149,.35)}
.fb.no{background:rgba(255,111,94,.10);border:1px solid rgba(255,111,94,.35)}
.fb.hint{background:rgba(245,185,63,.10);border:1px solid rgba(245,185,63,.35)}
.fb b{color:var(--ink)}
.fb .earn{display:block;margin-top:9px;font-size:12.5px;font-weight:650;color:var(--tok)}

/* sequencing */
.seq{display:grid;gap:8px}
.seq .step{
  display:flex;gap:11px;align-items:center;text-align:left;
  padding:11px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
}
.seq .step:hover:not(:disabled){border-color:var(--edge)}
.seq .step.picked{border-color:var(--tok);background:rgba(58,212,187,.10);opacity:.75}
.seq .step.bad{border-color:var(--bad);background:rgba(255,111,94,.12)}
.seq .num{
  flex:0 0 24px;height:24px;border-radius:7px;background:var(--panel-2);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim);
}
.seq .step.picked .num{background:var(--tok);color:var(--on-tok)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match .ch{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.mi{
  text-align:left;padding:10px 13px;border-radius:10px;font-size:13.5px;
  background:var(--panel);border:1px solid var(--line);transition:.12s;
}
.mi:hover:not(:disabled){border-color:var(--edge)}
.mi.sel{border-color:var(--gold);background:rgba(245,185,63,.12)}
.mi.gone{opacity:.32;border-style:dashed;cursor:default}
.mi.flash{border-color:var(--bad);background:rgba(255,111,94,.14)}

/* labelling */
.diagram{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.diagram svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;fill:rgba(245,185,63,.05);stroke:rgba(245,185,63,.5);stroke-width:1.3;stroke-dasharray:5 4}
.hot:hover{fill:rgba(245,185,63,.16)}
.hot.got{fill:rgba(79,220,149,.22);stroke:var(--good);stroke-dasharray:none;cursor:default}
.hot.miss{fill:rgba(255,111,94,.20);stroke:var(--bad)}
.dlabel{fill:#9fb4d4;font-size:9px}
.dtitle{fill:#cfe0f5;font-size:11px;font-weight:600}

/* data */
.chart{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.chart .ct{font-size:13px;font-weight:600;margin-bottom:2px}
.chart .cs{font-size:11.5px;color:var(--dim);margin-bottom:10px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.data th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
table.data td:first-child{font-weight:600}

/* exam */
textarea.exam{
  width:100%;min-height:130px;padding:13px 15px;border-radius:11px;resize:vertical;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;line-height:1.5;
}
textarea.exam:focus{outline:0;border-color:var(--tok)}
.scheme{margin-top:14px;padding:14px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.scheme h4{margin:0 0 4px;font-size:13px}
.scheme .note{font-size:12px;color:var(--dim);margin-bottom:11px}
.scheme label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;cursor:pointer;border-top:1px solid var(--hair)}
.scheme label input{margin-top:3px;accent-color:var(--tok);width:16px;height:16px;flex:0 0 auto}
.scheme h5{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* running mark total */
.scheme .tally{
  font-size:12px;color:var(--muted);padding:6px 10px;border-radius:8px;
  background:var(--sunk);border:1px solid var(--line);display:inline-block;margin-bottom:6px;
}
.scheme .tally b{color:var(--ink);font-size:13px}
.scheme .tally.full{border-color:rgba(79,220,149,.5)}
.scheme .tally.full b{color:var(--good)}

/* point + reason pairs (4-mark questions) */
.scheme .pr{border-top:1px solid var(--hair);padding:4px 0 6px}
.scheme .pr label{border-top:0;padding:6px 0}
.scheme .pr .r{margin-left:26px;color:var(--muted)}
.scheme .pr .r.off{opacity:.45}
.scheme .pr span{display:flex;gap:8px;align-items:flex-start}
.scheme .pr span i{
  font-style:normal;font-size:10.5px;font-weight:700;line-height:1.5;
  padding:0 6px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);
  color:var(--dim);flex:none;margin-top:1px;
}
.scheme .pr .p input:checked ~ span i{border-color:var(--tok);color:var(--tok)}
.scheme .pr .r input:checked ~ span i{border-color:var(--tok);color:var(--tok)}

/* levels of response (8-mark questions) */
.scheme .ind{
  padding:11px 13px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);margin-bottom:12px;
}
.scheme .ind ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.6}
.scheme .ind .cav{font-size:11.5px;color:var(--dim);margin-top:8px;font-style:italic}
.scheme label.lv span{display:block}
.scheme label.lv.picked{background:rgba(58,212,187,.08);border-radius:8px}
.scheme label.lv.picked b{color:var(--tok)}
.scheme label.lv b{display:block;color:var(--ink);margin-bottom:2px}
.scheme label.lv{color:var(--muted);font-size:13px}
.scheme .markpick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.scheme .markpick .ml{font-size:12px;color:var(--dim);margin-right:2px}
.scheme .mk{
  padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);transition:.12s;
}
.scheme .mk:hover:not(:disabled){border-color:var(--tok);color:var(--ink)}
.scheme .mk.on{background:rgba(58,212,187,.15);border-color:var(--tok);color:var(--tok)}

/* brief / case study panel */
.brief{
  padding:14px 16px;border-radius:12px;margin-bottom:18px;
  background:var(--brief-bg);border:1px solid var(--line);
}
.brief h4{margin:0 0 6px;font-size:13px;color:var(--gold)}
.brief p{margin:0;font-size:13.5px;color:var(--soft);line-height:1.55}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.facts span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}

/* summary */
.sum{text-align:center;padding:14px 0}
.sum .big{font-size:44px;font-weight:700;color:var(--tok);font-variant-numeric:tabular-nums}
.sum .cap{color:var(--muted);font-size:13.5px;margin-top:4px}
.sum .line{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

/* finale shop */
.budget{
  display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:16px;
  position:sticky;top:0;z-index:2;
}
.budget .lab{font-size:12px;color:var(--muted)}
.budget .amt{font-size:20px;font-weight:700;color:var(--tok);font-variant-numeric:tabular-nums}
.cat{margin-bottom:18px}
.cat>h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.cat>.cd{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.buy{
  width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start;
  padding:12px 15px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
  margin-bottom:8px;transition:.12s;
}
.buy:hover:not(:disabled){border-color:var(--edge)}
.buy.on{border-color:var(--tok);background:rgba(58,212,187,.10)}
.buy:disabled{opacity:.42;cursor:not-allowed}

/* ============================================================================

   Question types: mcq | order | match | label | data | exam
   ============================================================================ */

var LEVELS = [
  { n:1, name:"Hazardous Earth",                  comp:"Component 1", live:true  },
  { n:2, name:"Development Dynamics",             comp:"Component 1", live:false },
  { n:3, name:"Challenges of an Urbanising World",comp:"Component 1", live:false },

  { n:9, name:"Consuming Energy Resources",       comp:"Component 3", live:false }
];

/* ----------------------------------------------------------------------------
   TOPICS — the specification content, tested as concepts.
   No case studies live here: named places appear only as illustration.
   ---------------------------------------------------------------------------- */

var TOPICS = [

/* ---------------------------------------------------------------- 1.1 ---- */
{
  id:"circulation", ref:"1.1", name:"Global atmospheric circulation",
  short:"Circulation",
  theme:"Cells, pressure belts, winds, and the pattern of world climate zones",
  brief:"Three circulation cells in each hemisphere carry surplus heat from the tropics towards the poles. Where air rises you get low pressure and rain; where it sinks you get high pressure and desert. Get this straight and the position of the rainforests, the hot deserts, the trade winds and the tropical cyclone belts all follow from it. Switch on 'Show circulation cells' on the map to see the bands.",
  keys:["Hadley · Ferrel · Polar","Rising air = low pressure","Sinking air = high pressure","Coriolis deflection","The ITCZ"],
  qs:[
    { t:"order",
      q:"Name the circulation cells in order, starting at the equator and moving to the pole.",
      items:["Hadley cell (0° to 30°)","Ferrel cell (30° to 60°)","Polar cell (60° to 90°)"],
      hint:"There are only three, and the last one is named after the region it sits over.",
      why:"Each hemisphere has three cells: Hadley (equator to 30°), Ferrel (30° to 60°) and Polar (60° to pole). They transfer surplus heat from the tropics towards the poles, which is why the tropics do not keep getting hotter and the poles do not keep getting colder." },

    { t:"mcq",
      q:"Why does the equator receive so much rainfall?",
      opts:[
        "Cold air sinks there, forcing moisture out of the atmosphere",
        "Intense insolation heats the surface, so air rises, cools and condenses, creating low pressure and convectional rainfall",
        "Ocean currents push rain clouds towards the equator",
        "It is closest to the Sun, so the rain evaporates less"
      ], a:1,
      hint:"Rising air always does the same thing as it gains height.",
      why:"The equator receives the most concentrated insolation, because the Sun's rays strike almost vertically. The heated air rises, cools with height, and its water vapour condenses — producing low pressure, towering cloud and heavy convectional rainfall. This is why tropical rainforests lie along the equator." },

    { t:"mcq",
      q:"Why are most of the world's hot deserts found at around 30° north and south?",
      opts:[
        "Air is rising there, so all the rain falls elsewhere",
        "Air that rose at the equator has cooled, lost its moisture, and now descends — warming and drying as it sinks, creating high pressure",
        "They are the closest latitudes to the Sun",
        "Ocean currents there are unusually warm"
      ], a:1,
      hint:"Follow the air that rose at the equator. Where does it come back down, and what has it already lost?",
      why:"Air rising at the equator loses its moisture as rain, moves polewards at height, then descends at roughly 30°. Sinking air warms and its capacity to hold moisture increases, so there is no condensation and no cloud — giving stable high pressure and arid conditions. The Sahara, Arabian, Kalahari and Australian deserts all sit in this belt." },

    { t:"match",
      q:"Match each latitude to its pressure and typical climate.",
      pairs:[
        ["0° (equator)","Low pressure, rising air, heavy convectional rain — tropical rainforest"],
        ["30° north and south","High pressure, sinking air, very dry — hot deserts"],
        ["60° north and south","Low pressure where cold polar and warm tropical air meet — changeable, frontal rain"],
        ["90° (the poles)","High pressure, sinking dry air, very cold — polar desert"]
      ],
      hint:"Rising air always means low pressure and rain; sinking air always means high pressure and dry conditions.",
      why:"Alternating low and high pressure belts explain the pattern of global climate zones. The UK sits near 50–60°N at the polar front, which is exactly why our weather is so changeable — warm tropical air and cold polar air are constantly meeting overhead." },

    { t:"exam", marks:4,
      q:"Explain two ways in which global atmospheric circulation affects the pattern of world climate zones. (4 marks)",
      guidance:"Award 1 mark for each valid reason identified, and a further 1 mark where that reason is developed with an explanation of how or why it had that effect. A point stated without a reason scores 1 mark only. Credit a maximum of two developed reasons.",
      scheme:[
        {
          "p": "Air rises at the equator, creating a belt of low pressure",
          "r": "because intense insolation heats the surface, and as the air rises it cools and its water vapour condenses, giving the heavy convectional rainfall that supports tropical rainforest"
        },
        {
          "p": "Air descends at around 30° north and south, creating high pressure",
          "r": "because air that rose at the equator has already lost its moisture as rain, so as it sinks it warms and its capacity to hold moisture rises, meaning no condensation and therefore the world's hot desert belt"
        },
        {
          "p": "Low pressure forms at around 60° north and south",
          "r": "because warm tropical air meets cold polar air at the polar front and is forced to rise, producing the frontal rainfall and changeable weather of the mid-latitudes"
        },
        {
          "p": "High pressure sits over the poles",
          "r": "because very cold, dense air sinks there, and sinking air cannot produce precipitation, which is why the poles are classed as deserts despite the ice"
        },
        {
          "p": "Surface winds blow from the high pressure belts towards the low",
          "r": "because air always moves from high to low pressure, and the Coriolis effect deflects it into the trade winds and the westerlies rather than letting it travel due north or south"
        }
      ],
      why:"Notice how each creditable answer is a chain, not a fact. 'Air rises at the equator' on its own is worth 1 mark — it is a statement. The second mark comes from saying what that rising does: cools, condenses, rains, rainforest. In the exam, the words 'because', 'so' and 'which means' are what turn a 1-mark point into a 2-mark one." }
  ]
},

/* ---------------------------------------------------------------- 1.2 ---- */
{
  id:"naturalchange", ref:"1.2", name:"Natural climate change",
  short:"Climate change",
  theme:"Quaternary fluctuations, the evidence for them, and their natural causes",
  brief:"The climate changed long before anyone burned a lump of coal. Through the Quaternary — the last 2.6 million years — the Earth has swung between cold glacials and warm interglacials roughly every 100,000 years. This topic is about how we know that, from ice cores, tree rings, pollen and historical records, and what drove it: orbital cycles, variations in solar output, and volcanic eruptions.",
  keys:["Quaternary period","Ice cores over 400,000 years","Milankovitch cycles","Solar output","Volcanic cooling"],
  qs:[
    { t:"data",
      chart:{ kind:"line", title:"Atmospheric CO₂ from an Antarctic ice core", sub:"Carbon dioxide concentration over the last 400,000 years.",
        xlab:"Thousands of years ago", ylab:"CO₂ (ppm)", xmin:0, xmax:400, ymin:170, ymax:290, xflip:true,
        series:[{ label:"CO₂ (ppm)", colour:"#3ad4bb", points:[[400,280],[385,240],[370,200],[350,225],[340,240],[332,290],[320,250],[300,220],[280,215],[270,210],[255,235],[243,280],[230,255],[215,240],[200,215],[190,200],[170,195],[150,190],[138,200],[130,285],[120,278],[110,250],[100,235],[90,230],[80,235],[70,220],[60,205],[50,200],[40,205],[30,200],[25,190],[20,185],[15,200],[12,240],[8,265],[4,275],[0,280]] }]
      },
      q:"Roughly how often do the warm peaks in carbon dioxide occur?",
      opts:["About every 10,000 years","About every 100,000 years","About every 1,000 years","They occur completely at random"], a:1,
      hint:"Count the peaks across 400,000 years of record.",
      why:"There are about four peaks across 400,000 years, so a warm interglacial roughly every 100,000 years. That matches the eccentricity Milankovitch cycle — the change in the shape of Earth's orbit — which is strong evidence that orbital changes drive glacial and interglacial cycles." },

    { t:"mcq",
      q:"How does an ice core tell scientists about past carbon dioxide levels?",
      opts:[
        "The ice changes colour depending on the CO₂ level",
        "Bubbles of ancient air are trapped as the snow compacts into ice, and that air can be analysed directly",
        "Scientists estimate it from the thickness of each layer",
        "CO₂ is measured from fossils found inside the ice"
      ], a:1,
      hint:"The ice is not a proxy here — it is a container.",
      why:"Falling snow traps air between the flakes. As layer upon layer compacts into ice, that air is sealed into bubbles. Drilling down and releasing the bubbles gives a direct sample of the ancient atmosphere. Oxygen isotope ratios in the water molecules separately record the temperature at the time the snow fell." },

    { t:"match",
      q:"Match each source of evidence for past climate to what it reveals.",
      pairs:[
        ["Ice cores","Trapped air gives past greenhouse gas levels; isotopes give past temperature"],
        ["Tree rings","Wide rings indicate warm wet years, narrow rings cool dry years, dated year by year"],
        ["Pollen analysis","Preserved pollen in peat shows which plants grew, and therefore the climate they needed"],
        ["Historical records","Diaries, harvest dates and paintings such as Thames frost fairs record recent centuries"]
      ],
      hint:"Two of these give a record going back many thousands of years; two are much more recent.",
      why:"Ice cores give the longest record — hundreds of thousands of years. Tree rings and pollen cover thousands. Written and painted records only cover the last few hundred years but are very detailed, such as the frozen Thames during the Little Ice Age." },

    { t:"mcq",
      q:"Which of these is a Milankovitch cycle — a natural cause of long-term climate change?",
      opts:[
        "Changes in the shape of Earth's orbit, its axial tilt, and the wobble of its axis",
        "The burning of coal, oil and gas since the Industrial Revolution",
        "Deforestation of tropical rainforests",
        "The release of methane from intensive cattle farming"
      ], a:0,
      hint:"Three of these options are things people do.",
      why:"The three Milankovitch cycles are eccentricity (orbit shape, about 100,000 years), obliquity (axial tilt, about 41,000 years) and precession (the wobble of the axis, about 26,000 years). They alter how much solar radiation reaches different latitudes. The other three options are human causes — make sure you keep natural and human causes separate in the exam." },

    { t:"mcq",
      q:"What effect does a very large volcanic eruption usually have on global climate?",
      opts:[
        "Long-term warming lasting centuries",
        "Short-term cooling, because ash and sulphur dioxide reflect incoming solar radiation",
        "No measurable effect at all",
        "Immediate melting of the polar ice caps"
      ], a:1,
      hint:"Think about what a haze high in the atmosphere does to sunlight.",
      why:"Sulphur dioxide converts to sulphate aerosols in the stratosphere and reflects sunlight back to space, cooling the surface for a year or two. After the 1815 eruption of Tambora, 1816 became known in Europe and North America as 'the year without a summer'." }
  ]
},

/* ---------------------------------------------------------------- 1.3 ---- */
{
  id:"cyclones", ref:"1.3", name:"Tropical cyclones: formation and structure",
  short:"Cyclones",
  theme:"The conditions a cyclone needs, why it spins, what the parts are called, and how it is measured",
  brief:"Tropical cyclones need warm deep ocean, unstable rising air and enough spin from the Coriolis effect — which is why they form in a belt between about 5° and 30° of latitude and never on the equator itself. This topic covers the conditions, the sequence of formation, the anatomy of the storm and the scale used to rank it.",
  keys:["Sea over 26.5°C","5°–30° latitude","Eye and eyewall","Rain bands","Saffir–Simpson 1–5"],
  qs:[
    { t:"mcq",
      q:"Tropical cyclones can only form over oceans warmer than a certain temperature. What is that threshold?",
      opts:["18°C","22°C","26.5°C","32°C"], a:2,
      hint:"Think about the heat needed to evaporate enough water to power the storm — it is well above British sea temperatures.",
      why:"Sea surface temperatures must be at least 26.5°C, and warm to a depth of roughly 50–70 m. The warm water evaporates, and the latent heat released as that vapour condenses is the storm's energy source." },

    { t:"order",
      q:"Put the stages of tropical cyclone formation into the correct order.",
      items:[

/* ============================================================================
   3. STATE
   ============================================================================ */

var SAVE_KEY = "hazardous-earth-v3";   /* keys changed when case studies split from topics */

var state = { tokens:0, done:{}, finaleDone:false, finaleResult:null };

function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){ /* private mode */ }
}
function load(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    var v = JSON.parse(raw);
    if(v && typeof v === "object"){
      state.tokens      = v.tokens|0;
      state.done        = v.done || {};
      state.finaleDone  = !!v.finaleDone;
      state.finaleResult= v.finaleResult || null;
    }
  } catch(e){ /* corrupt or unavailable — start fresh */ }
}

function topicById(id){
  for(var i=0;i<TOPICS.length;i++) if(TOPICS[i].id===id) return TOPICS[i];
  return null;
}

/* Every case study across both pairs, flattened — this is what the map pins. */
function allStudies(){
  var out = [];
  PAIRS.forEach(function(pr){
    pr.studies.forEach(function(st){ out.push(st); });
  });
  return out;
}
function studyById(id){
  var all = allStudies();
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i];
  return null;
}
function pairOfStudy(id){
  for(var i=0;i<PAIRS.length;i++){
    if(PAIRS[i].studies.some(function(st){ return st.id===id; })) return PAIRS[i];
  }
  return null;
}
function compareById(id){
  for(var i=0;i<PAIRS.length;i++) if(PAIRS[i].compare.id===id) return PAIRS[i].compare;
  return null;
}
/* A comparison only opens once both halves of its pair are done. */
function compareReady(pr){
  return pr.studies.every(function(st){ return state.done[st.id] !== undefined; });
}

/* Any playable unit — topic, case study or comparison — resolved by id. */
function unitById(id){
  return topicById(id) || studyById(id) || compareById(id);
}

function doneCount(){ return Object.keys(state.done).length; }
function doneIn(list){
  return list.filter(function(u){ return state.done[u.id] !== undefined; }).length;
}
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ============================================================================
   4. THE COURSE
   The level is a cutaway of the hazardous Earth, and height on screen means
   what it says: the run starts on a cloud deck in the upper atmosphere, falls
   through the storm band to the coast where people live, drops into a rift cut
   through the crust, and climbs back out to the field stations at the end.
   Everything is drawn at quarter scale and blown up, so one drawn pixel is
   four screen pixels and nothing is ever anti-aliased.
   ============================================================================ */

var PX      = 4;      // one drawn pixel, in screen pixels
var VIEW_H  = 112;    // drawn height — 448 screen pixels
var SURFACE = 74;     // sea level: the ground line people live on
var STEP    = 118;    // distance between one stop and the next
var FLAT    = 38;     // half-width of the level ground at each stop

/* Where each topic sits in the Earth system, in order. 1.1 is high in the
   atmosphere; 1.5 and 1.6 are inside the crust; 1.7 comes back to the surface,
   because managing a hazard is something you do where the people are. */
var TOPIC_DEPTH = [38, 48, 60, SURFACE, 88, 100, SURFACE];

/* The hazard standing between each stop and the next. These are the obstacles
   you jump, and each one is the hazard the topic behind it has just taught. */
var GAP_HAZARD = ["gust","ice","eye","rubble","shard","lava","wave",
                  "rubble","wave","shard","gust","rubble","wave"];

var HAZARD = {
  gust:  { w:15, h:11, name:"Jet-stream gust" },
  ice:   { w:13, h:15, name:"Ice-age cold snap" },
  eye:   { w:15, h:20, name:"Cyclone eyewall" },
  rubble:{ w:17, h:12, name:"Collapsed masonry" },
  shard: { w:13, h:17, name:"Fault scarp" },
  lava:  { w:13, h:20, name:"Lava spurt" },
  wave:  { w:19, h:14, name:"Tsunami surge" }
};

var STOPS = [], TERRAIN = [], OBSTACLES = [], SCENERY = [], LANDMARKS = [];
var WORLD_W = 0, LAND_X = 0;

var reduceMotion = window.matchMedia &&
                   window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Repeatable noise, so scenery is scattered but never shimmers between frames. */
function rnd(i){ var v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); }

function buildCourse(){
  STOPS = [];
  TOPICS.forEach(function(t, i){
    STOPS.push({ kind:"topic", id:t.id, ref:t.ref, label:t.short, full:t.name,
                 y:TOPIC_DEPTH[i], colour:"#6a4fd8" });
  });
  PAIRS.forEach(function(pr){
    pr.studies.forEach(function(st){
      STOPS.push({ kind:"study", id:st.id, ref:"Case", label:st.short, full:st.name,
                   y:SURFACE, colour:pr.colour });
    });
    STOPS.push({ kind:"compare", id:pr.compare.id, ref:"Compare", label:pr.compare.name,
                 full:pr.compare.name, y:SURFACE, colour:pr.colour, pair:pr });
  });
  STOPS.push({ kind:"finale", id:"__finale", ref:"Finale", label:FINALE.title,
               full:FINALE.title, y:SURFACE, colour:"#ffc63c" });

  STOPS.forEach(function(s, i){ s.x = 86 + i * STEP; });
  WORLD_W = STOPS[STOPS.length - 1].x + 120;
  LAND_X  = STOPS[3].x - FLAT;          // the coast: where solid ground begins

  /* Terrain is a height profile — flat at every stop, a ramp in between. That
     makes it impossible to get stuck, which matters more here than platforming
     depth: nobody should be locked out of their revision by a missed jump. */
  TERRAIN = [{ x:0, y:STOPS[0].y }];
  STOPS.forEach(function(s){
    TERRAIN.push({ x:s.x - FLAT, y:s.y });
    TERRAIN.push({ x:s.x + FLAT, y:s.y });
  });
  TERRAIN.push({ x:WORLD_W, y:STOPS[STOPS.length - 1].y });

  OBSTACLES = [];
  for(var i = 0; i < STOPS.length - 1; i++){
    var kind = GAP_HAZARD[i % GAP_HAZARD.length];
    var d = HAZARD[kind];
    var x = Math.round((STOPS[i].x + STOPS[i + 1].x) / 2);
    OBSTACLES.push({ x:x, kind:kind, w:d.w, h:d.h, name:d.name, base:groundAt(x) });
  }

  buildScenery();
}

function groundAt(x){
  if(x <= TERRAIN[0].x) return TERRAIN[0].y;
  for(var i = 1; i < TERRAIN.length; i++){
    var b = TERRAIN[i];
    if(x <= b.x){
      var a = TERRAIN[i - 1];
      if(b.x === a.x) return b.y;
      return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x);
    }
  }
  return TERRAIN[TERRAIN.length - 1].y;
}

/* Scenery is scattered once and then only ever redrawn. The landmarks are
   placed against the stops they belong to, so each one is standing where its
   topic is taught. */
function buildScenery(){
  SCENERY = [];
  var i;
  for(i = 0; i < 110; i++)                     // stars, high and thin
    SCENERY.push({ t:"star", x:rnd(i) * WORLD_W, y:2 + rnd(i + 900) * 26, p:0.25 });
  for(i = 0; i < 26; i++)                      // cirrus, drawn as bare streaks
    SCENERY.push({ t:"cirrus", x:rnd(i + 17) * WORLD_W, y:10 + rnd(i + 610) * 22,
                   w:14 + Math.floor(rnd(i + 720) * 26), p:0.3 });
  for(i = 0; i < 40; i++)                      // cloud banks
    SCENERY.push({ t:"cloud", x:rnd(i + 40) * WORLD_W, y:30 + rnd(i + 300) * 30,
                   w:12 + Math.floor(rnd(i + 500) * 18), p:0.45 });
  for(i = 0; i < 70; i++)                      // magma bubbles, deep
    SCENERY.push({ t:"bubble", x:rnd(i + 70) * WORLD_W, y:98 + rnd(i + 200) * 12, p:0.8 });

  LANDMARKS = [
    { t:"rainbow", x:STOPS[0].x + 46 },        // 1.1 — the atmosphere, doing optics
    { t:"storm",   x:STOPS[2].x },             // 1.3 — the cyclone itself, in section
    { t:"town",    x:STOPS[3].x + 4 },         // 1.4 — the people a hazard happens to
    { t:"plates",  x:STOPS[4].x },             // 1.5 — two plates, converging
    { t:"volcano", x:STOPS[6].x - 34 }         // 1.7 — the thing being managed
  ];
  PAIRS.forEach(function(pr){
    pr.studies.forEach(function(st){
      var s = stopById(st.id);
      if(s) LANDMARKS.push({ t:"camp", x:s.x + 22, colour:pr.colour });
    });
  });
  LANDMARKS.push({ t:"gate", x:STOPS[STOPS.length - 1].x + 40 });
}

function stopById(id){
  for(var i = 0; i < STOPS.length; i++) if(STOPS[i].id === id) return STOPS[i];
  return null;
}
