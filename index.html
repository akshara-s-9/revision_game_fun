<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazardous Earth — GCSE Geography Expedition</title>
<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --bg:#0a1020;
  --bg-2:#0e1729;
  --panel:#131f36;
  --panel-2:#18273f;
  --line:#26395a;
  --ink:#e9eff8;
  --muted:#93a6c4;
  --dim:#6b7f9e;
  --tok:#3ad4bb;
  --gold:#f5b93f;
  --bad:#ff6f5e;
  --good:#4fdc95;
  --ocean:#081426;
  --c-constructive:#4fdc95;
  --c-destructive:#ff7a5e;
  --c-conservative:#ffd166;
  --c-collision:#b98cff;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 70% -10%, #16264400, #0a1020 70%),
    var(--bg);
  color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}

/* ============================================================
   HEADER / HUD
   ============================================================ */
.hud{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 18px;margin-bottom:18px;
  background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{font-size:17px}
.brand .sub{font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.tokens{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px;border-radius:999px;
  background:rgba(58,212,187,.10);border:1px solid rgba(58,212,187,.35);
  color:var(--tok);font-weight:650;font-variant-numeric:tabular-nums;
}
.tokens .gem{font-size:15px}
.tokens .n{font-size:18px}
.hud .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.btn{
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-weight:550;transition:.15s;
}
.btn:hover{background:#213353;border-color:#38537f}
.btn.primary{background:var(--tok);color:#062b25;border-color:transparent}
.btn.primary:hover{background:#4ee6cd}
.btn.ghost{background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============================================================
   LEVEL RAIL
   ============================================================ */
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:14px}
.lvl{
  flex:0 0 auto;min-width:150px;padding:10px 13px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);opacity:.5;
}
.lvl .no{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.lvl .nm{font-size:13px;font-weight:600;margin-top:3px}
.lvl.active{opacity:1;border-color:var(--tok);background:linear-gradient(180deg,#173a3a,#132437)}
.lvl.active .no{color:var(--tok)}
.lvl.done{opacity:1;border-color:var(--good)}

/* ============================================================
   MAP
   ============================================================ */
.mapcard{
  background:linear-gradient(180deg,#0c1730,#0a1224);
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow);position:relative;
}
.maptop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.maptop h2{font-size:15px;margin-right:auto}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.key i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
svg.map{display:block;width:100%;height:auto;border-radius:10px;background:#081426;touch-action:manipulation}
.land{fill:#1b2c46;stroke:#33507a;stroke-width:.8}
.ice{fill:#22354f;stroke:#3b5b86;stroke-width:.8}
.boundary{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.cellband{fill:#3ad4bb;opacity:.05}
.cellline{stroke:#3ad4bb;stroke-width:.6;opacity:.3;stroke-dasharray:4 5}
.celltext{fill:#5f7ea3;font-size:8px;letter-spacing:.12em}
.pin{cursor:pointer}
.pin .halo{fill:var(--gold);opacity:.16}
.pin .dot{fill:var(--gold);stroke:#0a1020;stroke-width:1.6}
.pin.done .dot{fill:var(--good)}
.pin.done .halo{fill:var(--good);opacity:.14}
.pin .lbl{fill:#cfe0f5;font-size:8.5px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0a1020;stroke-width:2.6;stroke-linejoin:round}
.pin:hover .halo{opacity:.34}
.pin .ring{fill:none;stroke:var(--gold);stroke-width:1.1;opacity:.5}
.pin.done .ring{stroke:var(--good)}

/* ============================================================
   SITE LIST
   ============================================================ */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.site{
  text-align:left;padding:13px 15px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);transition:.15s;
}
.site:hover{border-color:#3f5f8f;transform:translateY(-1px)}
.site .st{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.site .sn{font-weight:650;margin:3px 0 4px}
.site .sd{font-size:12.5px;color:var(--muted)}
.site .sc{margin-top:8px;font-size:11.5px;color:var(--tok);font-weight:600}
.site.done{border-color:rgba(79,220,149,.45)}
.site.done .sc{color:var(--good)}

/* ============================================================
   FINALE CARD
   ============================================================ */
.finale{
  margin-top:16px;padding:18px 20px;border-radius:var(--r);
  border:1px dashed var(--line);background:var(--bg-2);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.finale.ready{border:1px solid var(--gold);background:linear-gradient(180deg,#2a2210,#131c2e)}
.finale .ft{margin-right:auto}
.finale h3{font-size:15px}
.finale p{margin:5px 0 0;font-size:13px;color:var(--muted);max-width:62ch}
.bar{height:6px;border-radius:99px;background:#1d2c46;overflow:hidden;margin-top:9px;max-width:320px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--tok),var(--gold));transition:width .4s}

/* ============================================================
   MODAL
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(4,8,17,.78);backdrop-filter:blur(5px);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;
  overflow-y:auto;z-index:50;
}
.scrim[hidden]{display:none}
.modal{
  width:min(760px,100%);background:var(--bg-2);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--panel)}
.mhead .loc{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.mhead h2{font-size:16px;margin-top:2px}
.mhead .prog{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.mfoot .sp{margin-left:auto}
.x{font-size:20px;color:var(--dim);line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--ink);background:#22334f}

.qtype{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.qtext{font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;padding:12px 15px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);transition:.12s;
}
.opt:hover:not(:disabled){border-color:#4a6ea8;background:var(--panel-2)}
.opt.correct{border-color:var(--good);background:rgba(79,220,149,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,111,94,.12)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;width:22px;color:var(--dim);font-weight:600}

.fb{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.5}
.fb.ok{background:rgba(79,220,149,.10);border:1px solid rgba(79,220,149,.35)}
.fb.no{background:rgba(255,111,94,.10);border:1px solid rgba(255,111,94,.35)}
.fb.hint{background:rgba(245,185,63,.10);border:1px solid rgba(245,185,63,.35)}
.fb b{color:var(--ink)}
.fb .earn{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:650;color:var(--tok)}

/* sequencing */
.seq{display:grid;gap:8px}
.seq .step{
  display:flex;gap:11px;align-items:center;text-align:left;
  padding:11px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
}
.seq .step:hover:not(:disabled){border-color:#4a6ea8}
.seq .step.picked{border-color:var(--tok);background:rgba(58,212,187,.10);opacity:.75}
.seq .step.bad{border-color:var(--bad);background:rgba(255,111,94,.12)}
.seq .num{
  flex:0 0 24px;height:24px;border-radius:7px;background:var(--panel-2);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim);
}
.seq .step.picked .num{background:var(--tok);color:#062b25}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match .ch{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.mi{
  text-align:left;padding:10px 13px;border-radius:10px;font-size:13.5px;
  background:var(--panel);border:1px solid var(--line);transition:.12s;
}
.mi:hover:not(:disabled){border-color:#4a6ea8}
.mi.sel{border-color:var(--gold);background:rgba(245,185,63,.12)}
.mi.gone{opacity:.32;border-style:dashed;cursor:default}
.mi.flash{border-color:var(--bad);background:rgba(255,111,94,.14)}

/* labelling */
.diagram{background:#0a1526;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.diagram svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;fill:rgba(245,185,63,.05);stroke:rgba(245,185,63,.5);stroke-width:1.3;stroke-dasharray:5 4}
.hot:hover{fill:rgba(245,185,63,.16)}
.hot.got{fill:rgba(79,220,149,.22);stroke:var(--good);stroke-dasharray:none;cursor:default}
.hot.miss{fill:rgba(255,111,94,.20);stroke:var(--bad)}
.dlabel{fill:#9fb4d4;font-size:9px}
.dtitle{fill:#cfe0f5;font-size:11px;font-weight:600}

/* data */
.chart{background:#0a1526;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.chart .ct{font-size:13px;font-weight:600;margin-bottom:2px}
.chart .cs{font-size:11.5px;color:var(--dim);margin-bottom:10px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.data th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
table.data td:first-child{font-weight:600}

/* exam */
textarea.exam{
  width:100%;min-height:130px;padding:13px 15px;border-radius:11px;resize:vertical;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;line-height:1.5;
}
textarea.exam:focus{outline:0;border-color:var(--tok)}
.scheme{margin-top:14px;padding:14px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.scheme h4{margin:0 0 4px;font-size:13px}
.scheme .note{font-size:12px;color:var(--dim);margin-bottom:11px}
.scheme label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;cursor:pointer;border-top:1px solid rgba(38,57,90,.6)}
.scheme label input{margin-top:3px;accent-color:var(--tok);width:16px;height:16px;flex:0 0 auto}

/* brief / case study panel */
.brief{
  padding:14px 16px;border-radius:12px;margin-bottom:18px;
  background:linear-gradient(180deg,#152640,#111c30);border:1px solid var(--line);
}
.brief h4{margin:0 0 6px;font-size:13px;color:var(--gold)}
.brief p{margin:0;font-size:13.5px;color:#c3d3ea;line-height:1.55}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.facts span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:#0e1a2e;border:1px solid var(--line);color:var(--muted)}

/* summary */
.sum{text-align:center;padding:14px 0}
.sum .big{font-size:44px;font-weight:700;color:var(--tok);font-variant-numeric:tabular-nums}
.sum .cap{color:var(--muted);font-size:13.5px;margin-top:4px}
.sum .line{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

/* finale shop */
.budget{
  display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:16px;
  position:sticky;top:0;z-index:2;
}
.budget .lab{font-size:12px;color:var(--muted)}
.budget .amt{font-size:20px;font-weight:700;color:var(--tok);font-variant-numeric:tabular-nums}
.cat{margin-bottom:18px}
.cat>h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.cat>.cd{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.buy{
  width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start;
  padding:12px 15px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
  margin-bottom:8px;transition:.12s;
}
.buy:hover:not(:disabled){border-color:#4a6ea8}
.buy.on{border-color:var(--tok);background:rgba(58,212,187,.10)}
.buy:disabled{opacity:.42;cursor:not-allowed}
.buy .bn{font-weight:600;font-size:14px}
.buy .bd{font-size:12.5px;color:var(--muted);margin-top:3px}
.buy .cost{
  margin-left:auto;flex:0 0 auto;font-weight:700;color:var(--tok);
  font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap;
}
.buy.on .cost::after{content:" ✓"}

/* outcome */
.outcome{text-align:center;padding:6px 0 2px}
.medal{font-size:52px;line-height:1}
.outcome h2{font-size:24px;margin:8px 0 4px}
.outcome .tag{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{padding:13px;border-radius:11px;background:var(--panel);border:1px solid var(--line);text-align:center}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.debrief{text-align:left;font-size:13.5px;line-height:1.6}
.debrief h4{font-size:13px;color:var(--gold);margin:16px 0 7px}
.debrief li{margin-bottom:7px;color:#c3d3ea}
.debrief li b{color:var(--ink)}

@media (max-width:640px){
  .wrap{padding:12px 12px 40px}
  .match{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .hud{gap:12px}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>

<div class="wrap">

  <!-- ================= HUD ================= -->
  <header class="hud">
    <div class="brand">
      <h1>Hazardous Earth — Expedition</h1>
      <div class="sub">Edexcel GCSE Geography B · Component 1 · Topic 1</div>
    </div>
    <div class="tokens" title="Tokens earned from challenges. Spend them in the level finale.">
      <span class="gem">◈</span><span class="n" id="tokCount">0</span>
    </div>
    <div class="meta">
      <div id="siteCount">0 / 8 sites surveyed</div>
      <div id="unlockNote">Finale locked</div>
    </div>
    <button class="btn ghost" id="resetBtn" title="Wipe saved progress">Reset</button>
  </header>

  <!-- ================= LEVEL RAIL ================= -->
  <nav class="rail" id="rail"></nav>

  <!-- ================= MAP ================= -->
  <section class="mapcard">
    <div class="maptop">
      <h2>Fly to a case study</h2>
      <div class="key">
        <span><i style="background:var(--c-constructive)"></i>Constructive</span>
        <span><i style="background:var(--c-destructive)"></i>Destructive</span>
        <span><i style="background:var(--c-conservative)"></i>Conservative</span>
        <span><i style="background:var(--c-collision)"></i>Collision</span>
      </div>
      <label class="toggle"><input type="checkbox" id="cellsToggle"> Show circulation cells</label>
    </div>
    <div id="mapHost"></div>
    <div class="sites" id="siteList"></div>
    <div class="finale" id="finaleCard"></div>
  </section>

</div>

<!-- ================= MODAL ================= -->
<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhead">
      <div>
        <div class="loc" id="mLoc"></div>
        <h2 id="mTitle"></h2>
      </div>
      <div class="prog" id="mProg"></div>
      <button class="x" id="mClose" aria-label="Close">✕</button>
    </div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

var SAVE_KEY = "hazardous-earth-v1";

var state = { tokens:0, done:{}, finaleDone:false, finaleResult:null };

function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){ /* private mode */ }
}
function load(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    var v = JSON.parse(raw);
    if(v && typeof v === "object"){
      state.tokens      = v.tokens|0;
      state.done        = v.done || {};
      state.finaleDone  = !!v.finaleDone;
      state.finaleResult= v.finaleResult || null;
    }
  } catch(e){ /* corrupt or unavailable — start fresh */ }
}

function siteById(id){
  for(var i=0;i<SITES.length;i++) if(SITES[i].id===id) return SITES[i];
  return null;
}
function doneCount(){ return Object.keys(state.done).length; }
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

   5. THE MAP
   ============================================================================ */

function pathOf(points, close){
  var d = "";
  for(var i=0;i<points.length;i++){
    var pt = project(points[i][0], points[i][1]);
    d += (i ? "L" : "M") + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + " ";
  }
  return d + (close ? "Z" : "");
}

function buildMap(){
  var s = [];
  s.push('<svg class="map" viewBox="0 0 '+MAP_W+' '+MAP_H+'" role="img" aria-label="World map of Hazardous Earth case studies">');

  /* ocean */
  s.push('<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">'+
         '<stop offset="0%" stop-color="#0b1a30"/><stop offset="55%" stop-color="#08182b"/>'+
         '<stop offset="100%" stop-color="#0a1424"/></linearGradient></defs>');
  s.push('<rect width="'+MAP_W+'" height="'+MAP_H+'" fill="url(#sea)"/>');

  /* circulation cells (hidden by default) */
  s.push('<g id="cellLayer" style="display:none">');
  CELLS.forEach(function(c, i){
    var top = project(0, Math.max(c.from,c.to)).y;
    var bot = project(0, Math.min(c.from,c.to)).y;
    if(i % 2 === 0) s.push('<rect class="cellband" x="0" y="'+top.toFixed(1)+'" width="'+MAP_W+'" height="'+(bot-top).toFixed(1)+'"/>');
    s.push('<line class="cellline" x1="0" y1="'+top.toFixed(1)+'" x2="'+MAP_W+'" y2="'+top.toFixed(1)+'"/>');
    s.push('<text class="celltext" x="8" y="'+((top+bot)/2+3).toFixed(1)+'">'+c.name+'</text>');
  });
  s.push('<line class="cellline" x1="0" y1="'+project(0,0).y+'" x2="'+MAP_W+'" y2="'+project(0,0).y+'"/>');
  s.push('<text class="celltext" x="8" y="'+(project(0,0).y-4)+'">EQUATOR — ITCZ</text>');
  s.push('</g>');

  /* land */
  s.push('<g>');
  LANDMASSES.forEach(function(m){ s.push('<path class="land" d="'+pathOf(m.p,true)+'"/>'); });
  s.push('<path class="ice" d="'+pathOf(ANTARCTICA,true)+'"/>');
  s.push('</g>');

  /* plate boundaries */
  s.push('<g>');
  BOUNDARIES.forEach(function(b){
    s.push('<path class="boundary" stroke="'+BOUNDARY_COLOUR[b.t]+'" d="'+pathOf(b.p,false)+'"/>');
  });
  s.push('</g>');

  /* case-study pins */
  SITES.forEach(function(site){
    var p = project(site.lon, site.lat);
    var isDone = !!state.done[site.id];
    s.push('<g class="pin'+(isDone?" done":"")+'" data-site="'+site.id+'" tabindex="0" role="button" '+
           'aria-label="'+esc(site.name)+'">');
    s.push('<title>'+esc(site.name+" — "+site.sub)+'</title>');
    s.push('<circle class="halo" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="13"/>');
    s.push('<circle class="ring" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="8"/>');
    s.push('<circle class="dot"  cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4.5"/>');
    s.push('<text class="lbl" x="'+p.x.toFixed(1)+'" y="'+(p.y-15).toFixed(1)+'">'+esc(site.short)+(isDone?" ✓":"")+'</text>');
    s.push('</g>');
  });

  s.push('</svg>');
  document.getElementById("mapHost").innerHTML = s.join("");

  var cb = document.getElementById("cellsToggle");
  var layer = document.getElementById("cellLayer");
  if(cb && layer && cb.checked) layer.style.display = "";

  Array.prototype.forEach.call(document.querySelectorAll(".pin"), function(g){
    g.addEventListener("click", function(){ openSite(g.getAttribute("data-site")); });
    g.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openSite(g.getAttribute("data-site")); }
    });
  });
}

/* ============================================================================
   6. SHELL RENDERING
   ============================================================================ */

function renderHud(){

  document.getElementById("siteCount").textContent = doneCount() + " / " + SITES.length + " sites surveyed";
  var note = document.getElementById("unlockNote");
  if(state.finaleDone)            note.textContent = "Level 1 complete";
  else if(state.tokens >= FINALE.unlockAt) note.textContent = "Finale unlocked";
  else                            note.textContent = (FINALE.unlockAt - state.tokens) + " more tokens to unlock finale";
}

function renderRail(){
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  LEVELS.forEach(function(l){
    var cls = "lvl" + (l.live ? (state.finaleDone ? " done" : " active") : "");
    var n = el("div", cls,
      '<div class="no">Level '+l.n+(l.live?"":" · locked")+'</div>'+
      '<div class="nm">'+esc(l.name)+'</div>');

    rail.appendChild(n);
  });
}

function renderSites(){
  var host = document.getElementById("siteList");
  host.innerHTML = "";
  SITES.forEach(function(site){
    var earned = state.done[site.id];
    var b = el("button", "site" + (earned !== undefined ? " done" : ""),
      '<div class="st">'+esc(site.sub)+'</div>'+
      '<div class="sn">'+esc(site.name)+'</div>'+
      '<div class="sd">'+esc(site.theme)+'</div>'+
      '<div class="sc">'+(earned !== undefined
          ? "Surveyed · ◈ " + earned + " earned"
          : site.qs.length + " challenges · up to ◈ " + (site.qs.length*3))+'</div>');
    b.addEventListener("click", function(){ openSite(site.id); });
    host.appendChild(b);
  });
}

function renderFinaleCard(){
  var card = document.getElementById("finaleCard");
  var ready = state.tokens >= FINALE.unlockAt;
  card.className = "finale" + (ready ? " ready" : "");
  var pct = Math.min(100, Math.round(state.tokens / FINALE.unlockAt * 100));

  if(state.finaleDone && state.finaleResult){
    card.innerHTML =
      '<div class="ft"><h3>Level 1 complete — '+esc(state.finaleResult.tier)+'</h3>'+
      '<p>Your management plan saved lives in the simulated event. Replay the finale to try a different allocation, '+
      'or revisit any site to earn more tokens first.</p></div>';
    var again = el("button","btn primary","Replay finale");
    again.addEventListener("click", openFinale);
    card.appendChild(again);
    return;
  }

  card.innerHTML =
    '<div class="ft"><h3>Level finale — '+esc(FINALE.title)+'</h3>'+
    '<p>Spend your tokens as a hazard-management budget, then live with the consequences. '+
    'You need ◈ '+FINALE.unlockAt+' to begin — the more you bring, the more of the region you can protect.</p>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  var go = el("button","btn primary", ready ? "Begin the finale" : "◈ "+state.tokens+" / "+FINALE.unlockAt);
  go.disabled = !ready;
  go.addEventListener("click", openFinale);
  card.appendChild(go);
}

function renderAll(){ renderHud(); renderRail(); renderSites(); renderFinaleCard(); buildMap(); }

/* ============================================================================
   7. MODAL PLUMBING
   ============================================================================ */

var scrim = document.getElementById("scrim");

function openModal(loc, title){
  document.getElementById("mLoc").textContent   = loc;
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mProg").textContent  = "";
  document.getElementById("mBody").innerHTML    = "";
  document.getElementById("mFoot").innerHTML    = "";
  scrim.hidden = false;
  scrim.scrollTop = 0;
}
function closeModal(){ scrim.hidden = true; renderAll(); }

document.getElementById("mClose").addEventListener("click", closeModal);
scrim.addEventListener("click", function(e){ if(e.target === scrim) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !scrim.hidden) closeModal(); });

function foot(buttons){
  var f = document.getElementById("mFoot");
  f.innerHTML = "";
  buttons.forEach(function(b){
    if(b === null){ f.appendChild(el("div","sp")); return; }
    var n = el("button","btn"+(b.primary?" primary":b.ghost?" ghost":""), b.label);
    n.disabled = !!b.disabled;
    n.addEventListener("click", b.fn);
    f.appendChild(n);
  });
}

/* ============================================================================
   8. CHALLENGE ENGINE
   Scoring: right first time = 3 tokens · after a hint = 2 · after a retry = 1
   ============================================================================ */

var run = null;   // { site, i, earned, hinted, tries, answered }

function openSite(id){
  var site = siteById(id);
  if(!site) return;
  run = { site:site, i:0, earned:0, hinted:false, tries:0, answered:false };
  openModal(site.sub, site.name);
  showBrief();
}

function showBrief(){
  var site = run.site, body = document.getElementById("mBody");
  body.innerHTML =
    '<div class="brief"><h4>Field briefing</h4><p>'+esc(site.brief)+'</p>'+
    '<div class="facts">'+site.facts.map(function(f){ return "<span>"+esc(f)+"</span>"; }).join("")+'</div></div>'+
    '<p style="color:var(--muted);font-size:13.5px;margin:0">'+
    '<b style="color:var(--ink)">'+site.qs.length+' challenges</b> · '+esc(site.theme)+'<br>'+
    'Every challenge is worth <b style=\"color:var(--tok)\">◈ 3</b>. Each hint or mistake costs one token. '+
    'You always get the full explanation afterwards, right or wrong.</p>';
  document.getElementById("mProg").textContent = "";
  foot([ { label:"Close", fn:closeModal, ghost:true }, null,
         { label: state.done[site.id] !== undefined ? "Survey again" : "Begin survey", fn:nextQuestion, primary:true } ]);
}

function nextQuestion(){
  if(run.i >= run.site.qs.length) return showSummary();
  run.hinted = false; run.tries = 0; run.answered = false;
  document.getElementById("mProg").textContent = "Challenge " + (run.i+1) + " of " + run.site.qs.length;
  renderQuestion(run.site.qs[run.i]);
}

var TYPE_LABEL = { mcq:"Multiple choice", order:"Sequencing", match:"Matching pairs",
                   label:"Label the diagram", data:"Data response", exam:"Exam question" };

function renderQuestion(q){
  var body = document.getElementById("mBody");
  body.innerHTML = "";
  body.appendChild(el("div","qtype", TYPE_LABEL[q.t] || ""));

  var buttons = [];
  if(q.hint) buttons.push({ label:"Hint (◈ −1)", fn:showHint, ghost:true });
  buttons.push(null);
  buttons.push({ label:"Skip", fn:function(){ finishQuestion(0, true); }, ghost:true });
  foot(buttons);

  if(q.t === "mcq")        renderMcq(q, body);
  else if(q.t === "data")  renderData(q, body);
  else if(q.t === "order") renderOrder(q, body);
  else if(q.t === "match") renderMatch(q, body);
  else if(q.t === "label") renderLabel(q, body);
  else if(q.t === "exam")  renderExam(q, body);
}

function showHint(){
  if(run.answered) return;
  var q = run.site.qs[run.i];
  if(!q.hint || run.hinted) return;
  run.hinted = true;
  var body = document.getElementById("mBody");
  var f = el("div","fb hint","<b>Hint.</b> " + esc(q.hint));
  body.appendChild(f);
  f.scrollIntoView({ block:"nearest" });
  var btns = document.getElementById("mFoot").querySelectorAll("button");
  if(btns.length) btns[0].disabled = true;
}

/* tokens for the current question, given how it went */
function tokensFor(){
  if(run.tries <= 1) return run.hinted ? 2 : 3;
  return 1;
}

/* Show the explanation and move on. */
function finishQuestion(tokens, skipped){
  run.answered = true;
  var q = run.site.qs[run.i];
  var body = document.getElementById("mBody");

  var box = el("div","fb " + (tokens > 0 ? "ok" : "no"));
  box.innerHTML = "<b>" + (skipped ? "Skipped." : tokens > 0 ? "Correct." : "Not quite.") + "</b> " + esc(q.why) +
                  (tokens > 0 ? '<div class="earn">◈ +' + tokens + ' tokens</div>'
                              : '<div class="earn" style="color:var(--dim)">◈ +0 tokens</div>');
  body.appendChild(box);
  box.scrollIntoView({ block:"nearest" });

  run.earned += tokens;
  state.tokens += tokens;
  save();
  document.getElementById("tokCount").textContent = state.tokens;

  run.i++;
  foot([ { label:"Close", fn:closeModal, ghost:true }, null,
         { label: run.i >= run.site.qs.length ? "See results" : "Next challenge",
           fn: run.i >= run.site.qs.length ? showSummary : nextQuestion, primary:true } ]);
}

function showSummary(){
  var site = run.site;
  var best = state.done[site.id];
  state.done[site.id] = (best === undefined) ? run.earned : Math.max(best, run.earned);
  save();

  var max = site.qs.length * 3;
  var body = document.getElementById("mBody");
  document.getElementById("mProg").textContent = "";
  body.innerHTML =
    '<div class="sum"><div class="big">◈ '+run.earned+'</div>'+
    '<div class="cap">earned here, out of a possible '+max+'</div>'+
    '<div class="line">Total tokens: <b style="color:var(--tok)">◈ '+state.tokens+'</b>' +
    (state.tokens >= FINALE.unlockAt
      ? ' — enough to attempt the level finale.'
      : ' — you need ◈ '+FINALE.unlockAt+' to attempt the finale.') +
    '</div></div>';
  foot([ { label:"Retry this site", fn:function(){ openSite(site.id); }, ghost:true }, null,
         { label:"Back to the map", fn:closeModal, primary:true } ]);
}

/* ---- multiple choice ---------------------------------------------------- */

function renderMcq(q, body, prefixHtml){
  if(prefixHtml) body.insertAdjacentHTML("beforeend", prefixHtml);
  body.appendChild(el("div","qtext", esc(q.q)));

  var wrap = el("div","opts");
  var letters = "ABCD".split("");
  q.opts.forEach(function(text, idx){
    var b = el("button","opt", '<span class="k">'+(letters[idx]||"")+'</span>'+esc(text));
    b.addEventListener("click", function(){
      if(run.answered) return;
      var all = wrap.querySelectorAll(".opt");
      if(idx === q.a){
        b.classList.add("correct");
        Array.prototype.forEach.call(all, function(n){ n.disabled = true; });
        finishQuestion(tokensNow());
      } else {
        run.tries++;
        b.classList.add("wrong");
        b.disabled = true;
        if(run.tries >= 3){
          all[q.a].classList.add("correct");
          Array.prototype.forEach.call(all, function(n){ n.disabled = true; });
          finishQuestion(0);
        }
      }
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
}

/* tokens available right now: 3, minus one per mistake, minus one for a hint */
function tokensNow(){
  return Math.max(0, 3 - run.tries - (run.hinted ? 1 : 0));
}

/* ---- data response ------------------------------------------------------ */

function renderData(q, body){
  renderMcq(q, body, chartHtml(q.chart));
}

function chartHtml(c){
  var h = '<div class="chart"><div class="ct">'+esc(c.title)+'</div><div class="cs">'+esc(c.sub)+'</div>';

  if(c.kind === "table"){
    h += '<div style="overflow-x:auto"><table class="data"><thead><tr>';
    c.headers.forEach(function(x){ h += '<th>'+esc(x)+'</th>'; });
    h += '</tr></thead><tbody>';
    c.rows.forEach(function(r){
      h += '<tr>';
      r.forEach(function(x){ h += '<td>'+esc(x)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  else if(c.kind === "bars"){
    var globalMax = 0;
    c.series.forEach(function(s){ if(s.value > globalMax) globalMax = s.value; });
    c.series.forEach(function(s){
      var max = s.of || globalMax;
      var pct = Math.max(2, Math.round(s.value / max * 100));
      h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'+
             '<div style="flex:0 0 40%;font-size:12.5px;color:var(--muted)">'+esc(s.label)+'</div>'+
             '<div style="flex:1;height:16px;background:#132340;border-radius:5px;overflow:hidden">'+
               '<i style="display:block;height:100%;width:'+pct+'%;background:'+s.colour+'"></i></div>'+
             '<div style="flex:0 0 68px;text-align:right;font-weight:700;font-size:12.5px;'+
                  'font-variant-numeric:tabular-nums">'+esc(s.display)+'</div>'+
           '</div>';
    });
  }

  else if(c.kind === "line"){
    var W = 560, H = 240, L = 52, R = 542, T = 16, B = 196;
    var px = function(x){
      var t = (x - c.xmin) / (c.xmax - c.xmin);
      if(c.xflip) t = 1 - t;
      return L + t * (R - L);
    };
    var py = function(y){ return B - (y - c.ymin) / (c.ymax - c.ymin) * (B - T); };

    h += '<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto">';
    var i, v;
    for(i = 0; i <= 4; i++){                       // horizontal gridlines
      v = c.ymin + (c.ymax - c.ymin) * i / 4;
      h += '<line x1="'+L+'" y1="'+py(v).toFixed(1)+'" x2="'+R+'" y2="'+py(v).toFixed(1)+
           '" stroke="#1d2c46" stroke-width="1"/>'+
           '<text x="'+(L-8)+'" y="'+(py(v)+4).toFixed(1)+'" fill="#6b7f9e" font-size="10" text-anchor="end">'+
           Math.round(v)+'</text>';
    }
    for(i = 0; i <= 4; i++){                       // x-axis ticks
      v = c.xmin + (c.xmax - c.xmin) * i / 4;
      h += '<text x="'+px(v).toFixed(1)+'" y="'+(B+18)+'" fill="#6b7f9e" font-size="10" text-anchor="middle">'+
           Math.round(v)+'</text>';
    }
    c.series.forEach(function(s){
      var d = s.points.map(function(p, k){
        return (k ? "L" : "M") + px(p[0]).toFixed(1) + " " + py(p[1]).toFixed(1);
      }).join(" ");
      h += '<path d="'+d+'" fill="none" stroke="'+s.colour+'" stroke-width="2" '+
           'stroke-linejoin="round" stroke-linecap="round"/>';
    });
    h += '<text x="'+((L+R)/2)+'" y="'+(H-4)+'" fill="#6b7f9e" font-size="10.5" text-anchor="middle">'+
         esc(c.xlab)+'</text>';
    h += '<text x="14" y="'+((T+B)/2)+'" fill="#6b7f9e" font-size="10.5" text-anchor="middle" '+
         'transform="rotate(-90 14 '+((T+B)/2)+')">'+esc(c.ylab)+'</text>';
    h += '</svg>';
  }

  return h + '</div>';
}

/* ---- sequencing --------------------------------------------------------- */

function renderOrder(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));
  var hint = el("div","", "Click them in the correct order.");
  hint.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(hint);

  var wrap = el("div","seq");
  var placed = 0;
  var order = shuffle(q.items);

  order.forEach(function(text){
    var correctIndex = q.items.indexOf(text);
    var b = el("button","step", '<span class="num">·</span><span>'+esc(text)+'</span>');
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("picked")) return;
      if(correctIndex === placed){
        placed++;
        b.classList.remove("bad");
        b.classList.add("picked");
        b.querySelector(".num").textContent = placed;
        if(placed === q.items.length) finishQuestion(tokensNow());
      } else {
        run.tries++;
        b.classList.add("bad");
        setTimeout(function(){ b.classList.remove("bad"); }, 550);
        if(run.tries >= 3) revealOrder(wrap, q);
      }
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
}

function revealOrder(wrap, q){
  wrap.innerHTML = "";
  q.items.forEach(function(text, i){
    var n = el("div","step picked", '<span class="num">'+(i+1)+'</span><span>'+esc(text)+'</span>');
    wrap.appendChild(n);
  });
  finishQuestion(0);
}

/* ---- matching pairs ----------------------------------------------------- */

function renderMatch(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));
  var tip = el("div","", "Click a term, then click its definition.");
  tip.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(tip);

  var grid = el("div","match");
  var colL = el("div","col", '<div class="ch">Term</div>');
  var colR = el("div","col", '<div class="ch">Meaning</div>');
  var left = shuffle(q.pairs), right = shuffle(q.pairs);
  var selected = null, remaining = q.pairs.length;

  function clearSel(){
    if(selected){ selected.node.classList.remove("sel"); selected = null; }
  }
  function flash(n){
    n.classList.add("flash");
    setTimeout(function(){ n.classList.remove("flash"); }, 480);
  }

  left.forEach(function(p){
    var b = el("button","mi", esc(p[0]));
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("gone")) return;
      clearSel();
      selected = { key:p[0], node:b };
      b.classList.add("sel");
    });
    colL.appendChild(b);
  });

  right.forEach(function(p){
    var b = el("button","mi", esc(p[1]));
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("gone")) return;
      if(!selected){ flash(b); return; }
      if(selected.key === p[0]){
        selected.node.classList.add("gone");
        selected.node.classList.remove("sel");
        b.classList.add("gone");
        selected = null;
        remaining--;
        if(remaining === 0) finishQuestion(tokensNow());
      } else {
        run.tries++;
        flash(b); flash(selected.node);
        clearSel();
        if(run.tries >= 3) revealMatch(grid, q);
      }
    });
    colR.appendChild(b);
  });

  grid.appendChild(colL); grid.appendChild(colR);
  body.appendChild(grid);
}

function revealMatch(grid, q){
  grid.className = "";
  grid.innerHTML = q.pairs.map(function(p){
    return '<div class="mi gone" style="margin-bottom:8px"><b style="color:var(--ink)">'+
           esc(p[0])+'</b> — '+esc(p[1])+'</div>';
  }).join("");
  finishQuestion(0);
}

/* ---- label the diagram -------------------------------------------------- */

function renderLabel(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));

  var host = el("div","diagram", DIAGRAMS[q.diagram]());
  body.appendChild(host);

  var promptBox = el("div","fb hint");
  body.appendChild(promptBox);

  var step = 0;
  function ask(){
    if(step >= q.targets.length){ finishQuestion(tokensNow()); return; }
    promptBox.innerHTML = "<b>" + (step+1) + " of " + q.targets.length + ".</b> " + esc(q.targets[step].prompt);
  }

  Array.prototype.forEach.call(host.querySelectorAll(".hot"), function(h){
    h.addEventListener("click", function(){
      if(run.answered || h.classList.contains("got")) return;
      if(h.getAttribute("data-id") === q.targets[step].id){
        h.classList.add("got");
        step++;
        ask();
      } else {
        run.tries++;
        h.classList.add("miss");
        setTimeout(function(){ h.classList.remove("miss"); }, 520);
        if(run.tries >= 3){
          q.targets.forEach(function(t){
            var n = host.querySelector('[data-id="'+t.id+'"]');
            if(n) n.classList.add("got");
          });
          promptBox.innerHTML = "<b>Revealed.</b> The labelled features are highlighted above.";
          finishQuestion(0);
        }
      }
    });
  });
  ask();
}

/* ---- exam question with a self-marked mark scheme ------------------------ */

function renderExam(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));
  var note = el("div","", "Write your answer as you would in the exam, then reveal the mark scheme and mark yourself honestly.");
  note.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(note);

  var ta = el("textarea","exam");
  ta.placeholder = "Your answer (" + q.marks + " marks)…";
  body.appendChild(ta);

  foot([ null, { label:"Reveal mark scheme", primary:true, fn:function(){ reveal(); } } ]);

  function reveal(){
    if(run.answered) return;
    var box = el("div","scheme");
    box.innerHTML = '<h4>Mark scheme — credit any '+q.marks+' of these</h4>'+
                    '<div class="note">Tick every point you actually made. Be honest: the tokens are worth '+
                    'far less than knowing what you left out.</div>';
    q.scheme.forEach(function(pt, i){
      var lab = el("label","", '<input type="checkbox" data-i="'+i+'"><span>'+esc(pt)+'</span>');
      box.appendChild(lab);
    });
    body.appendChild(box);
    ta.disabled = true;
    box.scrollIntoView({ block:"nearest" });

    foot([ null, { label:"Score my answer", primary:true, fn:function(){
      var ticked = box.querySelectorAll("input:checked").length;
      var needed = Math.min(q.marks, q.scheme.length);
      var ratio  = ticked / needed;
      var tok    = ratio >= 1 ? 3 : ratio >= 0.5 ? 2 : ticked > 0 ? 1 : 0;
      Array.prototype.forEach.call(box.querySelectorAll("input"), function(n){ n.disabled = true; });
      finishQuestion(tok);
    }}]);
  }
}

/* ============================================================================
   9. DIAGRAMS
   ============================================================================ */

var DIAGRAMS = {

  /* Cross-section through a tropical cyclone approaching a coast. */
  cyclone: function(){
    var s = '<svg viewBox="0 0 620 300" role="img" aria-label="Cross-section of a tropical cyclone">';
    s += '<rect width="620" height="300" fill="#0b1b30"/>';

    /* cirrus outflow spreading away at the top */
    s += '<ellipse cx="310" cy="50" rx="158" ry="15" fill="#33527c" opacity=".6"/>';
    s += '<path d="M158 46 L108 32 M462 46 L512 32" stroke="#5c82b8" stroke-width="2" fill="none" opacity=".8"/>';

    /* cloud columns: tallest at the eyewall, shorter further out */
    function col(x, w, top, fill){
      return '<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+(248-top)+'" rx="'+(w/2)+'" fill="'+fill+'"/>';
    }
    s += col(84,  50, 172, "#2b4468");   /* outer band */
    s += col(478, 46, 166, "#2b4468");   /* outer band */
    s += col(158, 62, 128, "#3a5c8c");   /* inner band */
    s += col(400, 62, 128, "#3a5c8c");   /* inner band */
    s += col(244, 46,  62, "#5d8ac4");   /* eyewall */
    s += col(330, 46,  62, "#5d8ac4");   /* eyewall */

    /* rising air in the eyewall, sinking air in the eye */
    s += '<path d="M267 232 L267 88 M259 100 L267 82 L275 100" stroke="#eaf2fd" stroke-width="2.2" fill="none"/>';

  /* Oceanic plate subducting beneath a continental plate. */

/* ============================================================================
   10. THE FINALE
   ============================================================================ */

function openFinale(){
  var bought = {};
  var spent  = 0;
  var budget = state.tokens;

  openModal("Level 1 finale", FINALE.title);
  var body = document.getElementById("mBody");

  function totals(){
    var t = { lives:0, econ:0, recov:0 };
    FINALE.cats.forEach(function(c){
      c.items.forEach(function(it){
        if(bought[it.id]){ t.lives += it.lives; t.econ += it.econ; t.recov += it.recov; }
      });
    });
    FINALE.synergies.forEach(function(s){
      if(s.needs.every(function(id){ return bought[id]; })){ t.lives += s.lives; t.recov += s.recov; }
    });
    return t;
  }

  function draw(){
    body.innerHTML = "";
    body.insertAdjacentHTML("beforeend",
      '<div class="brief"><h4>Your assignment</h4><p>'+esc(FINALE.brief)+'</p></div>');

    var bar = el("div","budget",
      '<div><div class="lab">Budget remaining</div><div class="amt">◈ '+(budget-spent)+'</div></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="lab">Committed</div>'+
      '<div class="amt" style="color:var(--gold)">◈ '+spent+'</div></div>');
    body.appendChild(bar);

    FINALE.cats.forEach(function(c){
      var cat = el("div","cat", '<h4>'+esc(c.name)+'</h4><div class="cd">'+esc(c.desc)+'</div>');
      c.items.forEach(function(it){
        var on   = !!bought[it.id];
        var poor = !on && it.cost > (budget - spent);
        var b = el("button","buy"+(on?" on":""),
          '<div><div class="bn">'+esc(it.n)+'</div><div class="bd">'+esc(it.d)+'</div></div>'+
          '<div class="cost">◈ '+it.cost+'</div>');
        b.disabled = poor;
        b.addEventListener("click", function(){
          if(bought[it.id]){ delete bought[it.id]; spent -= it.cost; }
          else if(it.cost <= budget - spent){ bought[it.id] = true; spent += it.cost; }
          draw();
        });
        cat.appendChild(b);
      });
      body.appendChild(cat);
    });

    foot([ { label:"Back to the map", fn:closeModal, ghost:true }, null,
           { label:"Commit the plan", primary:true, disabled:spent === 0,
             fn:function(){ resolve(bought, spent, budget); } } ]);
  }

  draw();
}

function resolve(bought, spent, budget){
  var t = { lives:0, econ:0, recov:0 };
  var chosen = [];
  FINALE.cats.forEach(function(c){
    c.items.forEach(function(it){
      if(bought[it.id]){
        t.lives += it.lives; t.econ += it.econ; t.recov += it.recov;
        chosen.push({ cat:c.name, item:it });
      }
    });
  });

  var fired = [];
  FINALE.synergies.forEach(function(s){
    if(s.needs.every(function(id){ return bought[id]; })){
      t.lives += s.lives; t.recov += s.recov; fired.push(s);
    }
  });

  /* maxima, so the simulated outcome scales sensibly */
  var MAX = { lives:135, econ:79, recov:67 };
  var lp = Math.min(1, t.lives / MAX.lives);
  var ep = Math.min(1, t.econ  / MAX.econ);
  var rp = Math.min(1, t.recov / MAX.recov);

  var deaths   = Math.max(20, Math.round(2400 * (1 - lp) / 10) * 10);
  var loss     = Math.max(1.2, Math.round((11 - 9 * ep) * 10) / 10);
  var recovery = Math.max(8, Math.round(64 - 50 * rp));

  var tier, medal, tagline;
  if(lp >= 0.72)      { tier = "Gold — a model response"; medal = "🥇";
                        tagline = "Independent reviewers describe the region as one of the best-prepared in the world."; }
  else if(lp >= 0.48) { tier = "Silver — a solid plan"; medal = "🥈";
                        tagline = "The region coped, but clear gaps in the plan cost lives that better allocation would have saved."; }
  else if(lp >= 0.25) { tier = "Bronze — partial protection"; medal = "🥉";
                        tagline = "Some measures worked, but the response was overwhelmed in the worst-affected districts."; }
  else                { tier = "The plan failed"; medal = "⚠️";
                        tagline = "Too little was in place. This is what a hazard becoming a disaster looks like."; }

  var gaps = FINALE.gaps.filter(function(g){ return g.when(bought); });

  var html = '<div class="outcome"><div class="medal">'+medal+'</div><h2>'+esc(tier)+'</h2>'+
             '<div class="tag">'+esc(tagline)+'</div></div>';

  html += '<div class="stats">'+
    '<div class="stat"><div class="v" style="color:var(--bad)">'+deaths.toLocaleString()+'</div><div class="l">Deaths</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--gold)">$'+loss+'bn</div><div class="l">Economic loss</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--tok)">'+recovery+'</div><div class="l">Months to recover</div></div>'+
    '</div>';

  html += '<div class="debrief">';
  html += '<h4>What your budget bought</h4><ul>';
  if(!chosen.length) html += '<li>Nothing was funded, so the region faced the earthquake entirely unprepared.</li>';
  chosen.forEach(function(c){
    html += '<li><b>'+esc(c.item.n)+'</b> <span style="color:var(--dim)">('+esc(c.cat)+', ◈ '+c.item.cost+')</span> — '+esc(c.item.d)+'</li>';
  });
  html += '</ul>';

  if(fired.length){
    html += '<h4>Choices that worked together</h4><ul>';
    fired.forEach(function(s){ html += '<li>'+esc(s.note)+'</li>'; });
    html += '</ul>';
  }

  if(gaps.length){
    html += '<h4>What your plan left exposed</h4><ul>';
    gaps.forEach(function(g){ html += '<li>'+esc(g.text)+'</li>'; });
    html += '</ul>';
  }

  var left = budget - spent;
  html += '<h4>The examiner’s note</h4><ul>'+
          '<li>You committed <b>◈ '+spent+'</b> of <b>◈ '+budget+'</b>'+
          (left > 0 ? ', leaving ◈ '+left+' unspent. Unspent resources protect nobody — but nor does spreading a budget so thinly that nothing is finished.' : ', spending everything available.')+'</li>'+
          '<li>Notice the pattern: <b>protection and preparation saved the most lives</b>, while prediction on its own bought very little. '+
          'That is the argument to make in an exam answer about managing tectonic hazards.</li>'+
          '<li>Every real government faces this trade-off. Chile spent decades on building codes and lost around 525 people to a magnitude 8.8 earthquake. '+
          'Nepal could not afford to, and lost around 8,900 to a magnitude 7.8.</li>'+
          '</ul></div>';

  document.getElementById("mBody").innerHTML = html;
  document.getElementById("mProg").textContent = "";

  state.finaleDone = true;
  state.finaleResult = { tier:tier, deaths:deaths, loss:loss, recovery:recovery };
  save();

  foot([ { label:"Try a different plan", ghost:true, fn:openFinale }, null,
         { label:"Back to the map", primary:true, fn:closeModal } ]);
}

  var layer = document.getElementById("cellLayer");

});

  if(!confirm("Wipe all progress and start Level 1 again?")) return;
  state = { tokens:0, done:{}, finaleDone:false, finaleResult:null };
  save();
  renderAll();
  document.getElementById("cellsToggle").checked = false;
});

load();
renderAll();
