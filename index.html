  ["..PPPPPP..", ".PP...PPP.", "KK.....KKK"]    // right leg forward
];
var SPRITE_JUMP = ["..PPPPPP..", ".PP....PP.", "KK......KK"];
var HERO_H = 14;

var hero = { x:86, y:TOPIC_DEPTH[0], vy:0, dir:1, ground:true, frame:0, walk:0, bump:0 };
var camX = 0, tick = 0;

/* ----------------------------------------------------------------------------
   Landmarks. Everything here is plotted a pixel at a time rather than stroked,
   because a canvas arc would arrive anti-aliased and the whole point is that
   nothing on this course has a soft edge.
   ---------------------------------------------------------------------------- */
function drawRainbow(cx, cam){
  var cols = ["#ff5a4a","#ff9a2e","#ffc63c","#57cc4a","#3fd3ef","#5b3fd6","#b34fd8"];
  for(var b = 0; b < cols.length; b++){
    var r = 11 + b * 2;
    ctx.fillStyle = cols[b];
    for(var dx = -r; dx <= r; dx++){
      var sx = Math.round(cx - cam + dx);
      if(sx < 0 || sx >= viewW) continue;
      var y = Math.round(SURFACE - Math.sqrt(r * r - dx * dx));
      if(y < 2 || y > SURFACE) continue;
      ctx.fillRect(sx, y, 1, 2);
    }
  }
}

/* A cyclone in cross-section: the anvil spreading at the tropopause where the
   rising air can go no higher, the tower beneath it, and the rain coming out of
   the bottom. The rain is drawn later, in front of the cloud deck, because that
   is where rain goes. */
function drawStorm(cx, cam){
  var x0 = Math.round(cx - cam), y, w;
  if(x0 < -90 || x0 > viewW + 90) return;
  for(var a = 0; a < 5; a++)
    fill(a < 2 ? "#efe6ff" : "#cbb8f5", x0 - 42 + a * 3, 12 + a * 2, 88 - a * 7, 2);
  for(y = 20; y < 62; y++){
    var t = (y - 20) / 42;
    w = Math.round(18 + t * 30 + Math.sin(y * 0.55) * 3);
    fill(y < 32 ? "#dcd0fa" : y < 48 ? "#b6a2ec" : "#8d78d6",
         x0 - Math.floor(w / 2), y, w, 1);
  }
  for(y = 54; y < 62; y++){
    w = Math.round(48 + Math.sin(y * 0.7) * 4);
    fill("#6b57b4", x0 - Math.floor(w / 2), y, w, 1);
  }
}
function drawStormRain(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -90 || x0 > viewW + 90) return;
  for(var r = 0; r < 40; r++){
    var drop = reduceMotion ? 0 : Math.floor(tick * 0.9 + r * 5) % 16;
    var ry   = 60 + Math.round(rnd(r + 31) * 6) + drop;
    if(ry >= SURFACE) continue;
    fill("#7fd6ff", x0 - 24 + Math.round(rnd(r + 11) * 48), ry, 1, 3);
  }
}

/* The topic here is how a natural hazard becomes a disaster, so the row of
   buildings includes one that did not make it. */
function drawTown(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -80 || x0 > viewW + 80) return;
  [[-46,15,11],[-32,21,9],[-8,12,10],[8,18,13],[28,10,9]].forEach(function(d, i){
    var bx = x0 + d[0], h = d[1], w = d[2], top = SURFACE - h;
    fill("#7c7490", bx, top, w, h);
    fill("#a79ec0", bx, top, w, 1);
    fill("#544d68", bx + w - 2, top + 1, 2, h - 1);
    for(var wy = top + 2; wy < SURFACE - 2; wy += 3)
      for(var wx = bx + 1; wx < bx + w - 1; wx += 3)
        fill("#ffc63c", wx, wy, 1, 1);
  });
  var rx = x0 + 44;
  fill("#5f586e", rx, SURFACE - 6, 15, 6);
  fill("#7c7490", rx + 2, SURFACE - 9, 5, 3);
  fill("#7c7490", rx + 9, SURFACE - 8, 4, 2);
  fill("#a79ec0", rx, SURFACE - 6, 15, 1);
}

function arrow(x, y, dir, len, c){
  fill(c, dir > 0 ? x : x - len, y - 1, len, 3);
  for(var i = 0; i < 5; i++)
    fill(c, dir > 0 ? x + len + i : x - len - i, y - 4 + i, 1, 9 - 2 * i);
}

function drawPlates(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -60 || x0 > viewW + 60) return;
  arrow(x0 - 34, 97, 1, 14, "#ffc63c");
  arrow(x0 + 34, 97, -1, 14, "#ffc63c");
  for(var i = 0; i < 7; i++) fill("#d4512a", x0 - 1, 92 + i, 2, 1);   // the seam
}

/* Drawn in two halves: the cone sits in front of the sky, and the chamber and
   conduit are cut into the rock afterwards, which is what a cross-section is
   for. */
function drawVolcanoCone(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -50 || x0 > viewW + 50) return;
  for(var k = 0; k < 24; k++){
    var w = 3 + k;
    fill(k < 3 ? "#7c7490" : "#5c5070", x0 - w, SURFACE - 24 + k, w * 2, 1);
    if(k > 3 && k % 5 === 0) fill("#453b5c", x0 - w, SURFACE - 24 + k, w * 2, 1);
  }
  fill("#ff3d0d", x0 - 3, SURFACE - 25, 6, 3);
  fill("#ffc63c", x0 - 2, SURFACE - 26, 4, 2);
  for(var p = 0; p < 5; p++){
    var rise = reduceMotion ? 0 : (Math.floor(tick * 0.3 + p * 7) % 16);
    fill("#8b8398", x0 - 5 + p * 2, SURFACE - 28 - rise, 2, 2);
  }
}
function drawVolcanoRoots(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -50 || x0 > viewW + 50) return;
  for(var y = SURFACE; y < 102; y++) fill("#ff3d0d", x0 - 1, y, 3, 1);
  for(var k = 0; k < 7; k++){
    var w = 11 - Math.abs(k - 3) * 2;
    fill("#ff5a1e", x0 - w, 100 + k, w * 2, 1);
    if(k > 1 && k < 5) fill("#ffc63c", x0 - w + 2, 100 + k, w * 2 - 4, 1);
  }
}

function drawCamp(cx, cam, colour){
  var x0 = Math.round(cx - cam);
  if(x0 < -30 || x0 > viewW + 30) return;
  for(var r = 0; r < 10; r++) fill(colour, x0 - r, SURFACE - 10 + r, 1 + r * 2, 1);
  fill("#25103f", x0 - 2, SURFACE - 4, 4, 4);
  fill("#efe6ff", x0 - 10, SURFACE - 1, 21, 1);
  fill("#8b8398", x0 + 14, SURFACE - 14, 1, 14);                    // an aerial
  fill(colour,    x0 + 15, SURFACE - 14, 5, 3);
}

function drawGate(cx, cam){
  var x0 = Math.round(cx - cam);
  if(x0 < -40 || x0 > viewW + 40) return;
  var open = state.tokens >= FINALE.unlockAt;
  fill("#5c5070", x0 - 20, SURFACE - 30, 5, 30);
  fill("#5c5070", x0 + 15, SURFACE - 30, 5, 30);
  fill("#7c7490", x0 - 20, SURFACE - 30, 5, 2);
  fill("#7c7490", x0 + 15, SURFACE - 30, 5, 2);
  fill(open ? "#ffc63c" : "#5c5070", x0 - 22, SURFACE - 35, 44, 5);
  if(!open) for(var b = 0; b < 4; b++)
    fill("#8b8398", x0 - 15, SURFACE - 27 + b * 7, 30, 3);
}

/* ----------------------------------------------------------------------------
   Canvas
   ---------------------------------------------------------------------------- */
var stage, cv, ctx, viewW = 240;

function sizeCanvas(){
  var wide = stage.clientWidth || 900;
  viewW = Math.max(120, Math.round(wide / PX));
  cv.width  = viewW;
  cv.height = VIEW_H;
  cv.style.height = (VIEW_H * PX) + "px";
  ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
}

function fill(c, x, y, w, h){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

/* A one-pixel checkerboard, which is how a 16-colour machine made a gradient. */
function ditherRow(c, y, cam){
  ctx.fillStyle = c;
  for(var x = (cam + y) % 2; x < viewW; x += 2) ctx.fillRect(x, y, 1, 1);
}

function drawSprite(sx, sy, legs, dir){
  var rows = SPRITE_TOP.concat([legs[0], legs[1], legs[2]]);
  for(var r = 0; r < rows.length; r++){
    var row = rows[r];
    for(var c = 0; c < row.length; c++){
      var ch = row.charAt(dir > 0 ? c : row.length - 1 - c);
      if(ch === ".") continue;
      ctx.fillStyle = SPRITE_PAL[ch];
      ctx.fillRect(sx + c, sy + r, 1, 1);
    }
  }
}

function drawHazard(o, sx, h){
  var top = Math.round(o.base) - h, x = sx - Math.floor(o.w / 2), w = o.w;
  var i, k, t, iw, bx, sway;
  if(h <= 1) return;
  switch(o.kind){

    case "gust":                                   /* a curl of jet-stream wind */
      for(k = 0; k < h; k++){
        t    = k / (h - 1);
        iw   = Math.max(3, Math.round(3 + Math.sin(t * Math.PI) * w * 0.46));
        sway = reduceMotion ? 0 : Math.round(Math.sin(t * 3.1 + tick * 0.17) * 2);
        bx   = x + Math.floor((w - iw) / 2) + sway;
        fill(k % 2 ? "#e8fbff" : "#8fd8ef", bx, top + k, iw, 1);
      }
      fill("#ffffff", x + Math.floor(w / 2) - 1, top + 2, 2, h - 4);
      for(i = 0; i < 3; i++){                      // torn off downwind
        var len = 5 + ((i + Math.floor(tick / 8)) % 3) * 3;
        fill("#dff6ff", x - len - 1, top + 2 + i * 4, len, 1);
      }
      break;

    case "ice":                                    /* a block with facets */
      fill("#8fd0ee", x, top + 2, w, h - 2);
      fill("#cdeeff", x + 1, top + 3, w - 3, h - 6);
      for(i = 0; i < w; i += 3)                    // a broken upper surface
        fill("#ffffff", x + i, top + (i % 2 ? 0 : 2), 3, 3);
      fill("#5f9fc4", x, top + h - 3, w, 3);
      fill("#ffffff", x + 3, top + 5, 1, h - 9);
      fill("#ffffff", x + w - 5, top + 4, 1, 4);
      break;

    case "eye":                                    /* the eyewall, spinning */
      for(k = 0; k < h; k++){
        t    = k / (h - 1);
        iw   = Math.max(4, Math.round((w * (1 - t * 0.6)) / 2) * 2);
        sway = reduceMotion ? 0 : Math.round(Math.sin(k * 0.62 + tick * 0.14) * 1.7);
        bx   = x + Math.floor((w - iw) / 2) + sway;
        fill(k % 3 === 0 ? "#efe6ff" : "#a893e0", bx, top + k, iw, 1);
        fill("#3f2296", bx + Math.floor(iw / 2) - 1, top + k, 2, 1);   // the eye
      }
      break;

    case "rubble":                                 /* what the shaking left */
      fill("#7c7490", x, top + 4, w, h - 4);
      fill("#a79ec0", x, top + 4, w, 2);
      fill("#4a4360", x + 2, top + h - 3, w - 4, 3);
      fill("#7c7490", x + 4, top, 6, 5);
      fill("#a79ec0", x + 4, top, 6, 1);
      fill("#4a4360", x + 1, top + 7, 3, 1);
      fill("#4a4360", x + w - 6, top + 9, 4, 1);
      break;

    case "shard":                                  /* a fault scarp, thrown up */
      for(k = 0; k < h; k++){
        t  = k / (h - 1);                          // 0 at the tip, 1 at the base
        iw = Math.max(2, Math.round((w * (0.22 + 0.78 * t)) / 2) * 2);
        bx = x + Math.floor((w - iw) / 2);
        fill(k < 3 ? "#d4512a" : (k % 5 === 0 ? "#8f5030" : "#6b3a22"), bx, top + k, iw, 1);
        if(k > 3 && k % 5 === 0) fill("#a8613a", bx, top + k, iw, 1);
      }
      fill("#ffb27a", x + Math.floor(w / 2) - 1, top, 2, 3);
      break;

    case "lava":                                   /* a spurt, on a timer */
      fill("#2a1a10", x, Math.round(o.base) - 3, w, 4);
      fill("#0f0806", x + 3, Math.round(o.base) - 3, w - 6, 2);
      for(k = 0; k < h; k++){
        t    = k / (h - 1);
        iw   = Math.max(2, Math.round((w * (0.2 + 0.8 * t) * 0.72) / 2) * 2);
        sway = reduceMotion ? 0 : Math.round(Math.sin(k * 0.85 + tick * 0.22) * 1.2);
        bx   = x + Math.floor((w - iw) / 2) + sway;
        fill("#ff3d0d", bx, top + k, iw, 1);
        if(iw > 4) fill("#ffc63c", bx + 1, top + k, iw - 2, 1);
        if(iw > 7) fill("#fff2c0", bx + 2, top + k, iw - 4, 1);
      }
      break;

    case "wave":                                   /* a surge, about to break */
      for(k = 0; k < h; k++){
        t  = k / (h - 1);
        iw = Math.max(3, Math.round(w * (0.4 + 0.6 * t)));
        fill(t < 0.3 ? "#5cc4f5" : t < 0.7 ? "#1f7fd0" : "#12508a",
             x + (w - iw), top + k, iw, 1);
      }
      fill("#ffffff", x + w - 8, top,     8, 2);   // the crest, curling over
      fill("#ffffff", x + w - 10, top + 2, 4, 1);
      fill("#dff2ff", x + w - 12, top + 3, 3, 1);
      for(i = 0; i < 3; i++){
        var ph = reduceMotion ? 0 : Math.floor(tick / 9 + i) % 2;
        fill("#c9edff", x + 2 + i * 5, top + 6 + i * 2 + ph, 3, 1);
      }
      break;
  }
}

function hazardHeight(o){
  if(o.kind !== "lava") return o.h;
  if(reduceMotion) return Math.round(o.h * 0.45);
  return Math.round(o.h * (0.5 + 0.5 * Math.sin(tick * 0.045 + o.x)));
}

function drawCourse(){
  var cam = Math.floor(camX), x, y, wx, g;

  /* --- the atmosphere, in bands, dithered where one gives way to the next --- */
  fill("#2b1466", 0, 0,  viewW, 24);
  fill("#3f2296", 0, 24, viewW, 16);
  fill("#5b3fd6", 0, 40, viewW, 16);
  fill("#7d5eea", 0, 56, viewW, 10);
  fill("#9d86f2", 0, 66, viewW, SURFACE - 66);
  ditherRow("#3f2296", 23, cam); ditherRow("#3f2296", 22, cam);
  ditherRow("#5b3fd6", 39, cam); ditherRow("#7d5eea", 55, cam);
  ditherRow("#9d86f2", 65, cam);

  /* --- everything behind the ground --- */
  SCENERY.forEach(function(s){
    var px = Math.round(s.x - cam * s.p);
    if(s.t === "star"){
      px = ((px % WORLD_W) + WORLD_W) % WORLD_W;
      if(px < viewW) fill(rnd(s.x) > 0.6 ? "#ffffff" : "#c9b6ff", px, s.y, 1, 1);
    }
  });
  LANDMARKS.forEach(function(l){
    if(l.t === "rainbow") drawRainbow(l.x, cam);
  });
  SCENERY.forEach(function(s){
    var px = Math.round(s.x - cam * s.p);
    if(px < -60 || px > viewW) return;
    if(s.t === "cirrus"){
      fill("rgba(255,255,255,.22)", px, s.y, s.w, 1);
      fill("rgba(255,255,255,.13)", px + 4, s.y + 2, s.w - 9, 1);
    } else if(s.t === "cloud"){
      var drift = reduceMotion ? 0 : Math.round(Math.sin(tick * 0.006 + s.x) * 3);
      fill("rgba(255,255,255,.20)", px + drift, s.y, s.w, 3);
      fill("rgba(255,255,255,.13)", px + drift + 2, s.y - 2, s.w - 5, 2);
    }
  });
  LANDMARKS.forEach(function(l){
    if(l.t === "storm")   drawStorm(l.x, cam);
    if(l.t === "volcano") drawVolcanoCone(l.x, cam);
  });

  /* --- the ocean, which is where the first half of the course happens --- */
  var seaEnd = Math.min(viewW, LAND_X - cam);
  if(seaEnd > 0){
    fill("#1f7fd0", 0, SURFACE,      seaEnd, 8);
    fill("#145a9e", 0, SURFACE + 8,  seaEnd, 10);
    fill("#0d3d72", 0, SURFACE + 18, seaEnd, 96 - SURFACE - 18);
    ditherRow("#145a9e", SURFACE + 7,  cam);
    ditherRow("#0d3d72", SURFACE + 17, cam);
    /* oceanic crust: thinner than the continental kind, and the reason the
       depth ruler down the left is telling the truth */
    fill("#3a1f13", 0, 96,  seaEnd, VIEW_H - 96);
    fill("#5c3320", 0, 96,  seaEnd, 2);
    fill("#c8391c", 0, 104, seaEnd, VIEW_H - 104);
    ditherRow("#3a1f13", 95,  cam);
    ditherRow("#c8391c", 103, cam);
    for(x = 0; x < seaEnd; x++){
      if((x + cam) % 9 === 0) fill("#4a2a1a", x, 98, 1, 4);
      if((x + cam + Math.floor(tick / 14)) % 6 === 0) fill("#ff9a2e", x, 104, 1, 2);
    }
    for(x = 0; x < seaEnd; x += 7){
      var bob = reduceMotion ? 0 : Math.round(Math.sin((x + cam + tick * 0.5) * 0.25));
      fill("#7fd6ff", x, SURFACE + bob, 4, 1);
    }
  }

  /* --- the ground itself, one column at a time --- */
  for(x = 0; x < viewW; x++){
    wx = cam + x;
    if(wx < 0 || wx > WORLD_W) continue;
    g = Math.round(groundAt(wx));

    if(wx < LAND_X){
      /* a floating deck of cloud, nine pixels thick */
      fill("#ffffff", x, g,     1, 2);
      fill("#c9b2f7", x, g + 2, 1, 3);
      fill("#8f6ce0", x, g + 5, 1, 4);
      if((wx + g) % 3 === 0) fill("#7a5ad0", x, g + 8, 1, 2);
      continue;
    }

    /* solid earth: strata by absolute depth, so the rift walls read as layers */
    fill("#8a4b2c", x, g, 1, VIEW_H - g);
    var s1 = Math.max(g, 84), s2 = Math.max(g, 94), s3 = Math.max(g, 104);
    if(s1 < VIEW_H) fill("#5c3320", x, s1, 1, VIEW_H - s1);
    if(s2 < VIEW_H) fill("#3a1f13", x, s2, 1, VIEW_H - s2);
    if(s3 < VIEW_H) fill("#c8391c", x, s3, 1, VIEW_H - s3);
    if(s1 < VIEW_H && (wx + s1) % 2 === 0) fill("#8a4b2c", x, s1 - 1, 1, 1);
    if(s2 < VIEW_H && (wx + s2) % 2 === 0) fill("#5c3320", x, s2 - 1, 1, 1);
    if(s3 < VIEW_H && (wx + s3) % 2 === 0) fill("#3a1f13", x, s3 - 1, 1, 1);
    if(g < 90 && (wx * 7 + g) % 23 === 0) fill("#6b3d24", x, g + 6, 1, 3);
    if(s3 < VIEW_H && (wx + Math.floor(tick / 12)) % 5 === 0) fill("#ff9a2e", x, s3, 1, 2);

    /* the surface edge, which gets hotter the deeper you have cut into it */
    if(g <= SURFACE + 3){
      fill("#57cc4a", x, g,     1, 3);
      fill("#2f8f36", x, g + 3, 1, 2);
      if(wx % 11 === 0) fill("#6fe05c", x, g - 2, 1, 2);
    } else if(g <= 94){
      fill("#a8613a", x, g, 1, 2);
    } else {
      fill("#d4512a", x, g, 1, 2);
    }
  }

  /* --- landmarks that belong in front of, or cut into, the ground --- */
  LANDMARKS.forEach(function(l){
    if(l.t === "storm")   drawStormRain(l.x, cam);
    if(l.t === "volcano") drawVolcanoRoots(l.x, cam);
    if(l.t === "plates")  drawPlates(l.x, cam);
    if(l.t === "town")    drawTown(l.x, cam);
    if(l.t === "camp")    drawCamp(l.x, cam, l.colour);
    if(l.t === "gate")    drawGate(l.x, cam);
  });

  /* magma bubbles, only where there is rock to hold them */
  SCENERY.forEach(function(s){
    if(s.t !== "bubble") return;
    var px = Math.round(s.x - cam);
    if(px < 0 || px >= viewW) return;
    var lift = reduceMotion ? 0 : Math.round(Math.sin(tick * 0.02 + s.x) * 2);
    if(s.x >= LAND_X && s.y + lift <= groundAt(s.x)) return;
    fill("#ff9a2e", px, s.y + lift, 1, 1);
  });

  /* --- the hazards --- */
  OBSTACLES.forEach(function(o){
    var px = Math.round(o.x - cam);
    if(px < -30 || px > viewW + 30) return;
    drawHazard(o, px, hazardHeight(o));
  });

  /* --- a signpost under every stop, so the label above it is anchored --- */
  STOPS.forEach(function(s){
    var px = Math.round(s.x - cam);
    if(px < -12 || px > viewW + 12) return;
    var done = state.done[s.id] !== undefined ||
               (s.kind === "finale" && state.finaleDone);
    fill("#efe6ff", px - 1, s.y - 20, 2, 20);
    fill("#8f6ce0", px + 1, s.y - 20, 1, 20);
    fill(done ? "#3fd97f" : s.colour, px - 4, s.y - 22, 9, 3);
    fill("#25103f", px - 3, s.y - 1, 7, 1);
  });

  /* --- the runner --- */
  var hx = Math.round(hero.x - cam), hy = Math.round(hero.y);
  var legs = hero.ground ? SPRITE_LEGS[hero.frame] : SPRITE_JUMP;
  fill("rgba(18,8,38,.34)", hx - 5, hy, 10, 1);
  if(hero.bump > 0 && Math.floor(tick / 3) % 2 === 0) ctx.globalAlpha = 0.55;
  drawSprite(hx - 5, hy - HERO_H, legs, hero.dir);
  ctx.globalAlpha = 1;
}

/* ----------------------------------------------------------------------------
   Physics. Gravity, one jump, and hazards you cannot walk through.
   ---------------------------------------------------------------------------- */
var GRAV = 0.20, JUMP = -3.4, RUN = 2.4;
var keys = {};

function step(){
  tick++;
  if(hero.bump > 0) hero.bump--;

  var move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if(move !== 0){ hero.dir = move; hero.walk += 0.22; }
  hero.frame = move !== 0 ? (Math.floor(hero.walk) % 4) : 0;

  var wanted = hero.x + move * RUN;
  wanted = Math.max(10, Math.min(WORLD_W - 10, wanted));

  /* Hazards are solid until you are over them. */
  if(move !== 0){
    for(var i = 0; i < OBSTACLES.length; i++){
      var o = OBSTACLES[i], h = hazardHeight(o);
      if(h <= 2) continue;
      var oL = o.x - o.w / 2 - 4, oR = o.x + o.w / 2 + 4;
      var clear = hero.y <= o.base - h;
      if(clear) continue;
      if(wanted > oL && wanted < oR && (hero.x <= oL || hero.x >= oR)){
        wanted = hero.x <= oL ? oL : oR;
        hero.bump = 12;
      } else if(wanted > oL && wanted < oR){
        wanted = move > 0 ? oL : oR;   // already inside: nudge back out
        hero.bump = 12;
      }
    }
  }
  hero.x = wanted;

  if(keys.jump && hero.ground){ hero.vy = JUMP; hero.ground = false; keys.jump = 0; }

  var g = groundAt(hero.x);
  if(hero.ground){
    hero.y = g;
  } else {
    hero.vy += GRAV;
    hero.y  += hero.vy;
    if(hero.vy >= 0 && hero.y >= g){ hero.y = g; hero.vy = 0; hero.ground = true; }
  }

  var target = Math.max(0, Math.min(WORLD_W - viewW, hero.x - viewW / 2));
  camX = reduceMotion ? target : camX + (target - camX) * 0.16;
  if(Math.abs(target - camX) < 0.4) camX = target;
}

var running = false;
function frame(){
  if(!running) return;
  step();
  drawCourse();
  placeMarkers();
  requestAnimationFrame(frame);
}
function startLoop(){ if(!running){ running = true; requestAnimationFrame(frame); } }
function stopLoop(){ running = false; }

/* ----------------------------------------------------------------------------
   Signposts. Drawn in HTML rather than on the canvas, so every stop is a real
   button with real text: readable, focusable and reachable without the game.
   ---------------------------------------------------------------------------- */
var markerHost, markerEls = [];

function stopState(s){
  if(s.kind === "compare") return compareReady(s.pair) ? "open" : "locked";
  if(s.kind === "finale")  return state.tokens >= FINALE.unlockAt ? "open" : "locked";
  return "open";
}
function stopUnit(s){
  return s.kind === "finale" ? null : unitById(s.id);
}
function stopStatus(s){
  var earned = state.done[s.id];
  if(s.kind === "finale"){
    if(state.finaleDone) return "Complete";
    return state.tokens >= FINALE.unlockAt
      ? "Ready" : "◈ " + state.tokens + " / " + FINALE.unlockAt;
  }
  if(earned !== undefined) return "◈ " + earned + " earned";
  if(stopState(s) === "locked") return "Locked";
  var u = stopUnit(s);
  return u ? u.qs.length + " × ◈ 3" : "";
}

function renderMarkers(){
  markerEls.forEach(function(b){ if(b.parentNode) b.parentNode.removeChild(b); });
  markerEls = STOPS.map(function(s){
    var b = el("button", "mark");
    b.setAttribute("data-kind", s.kind);
    b.style.setProperty("--pair", s.colour);
    markerHost.appendChild(b);
    updateMarker(b, s);
    b.addEventListener("click", function(){ goTo(s); });
    return b;
  });
  placeMarkers();
}

function updateMarker(b, s){
  var done   = state.done[s.id] !== undefined || (s.kind === "finale" && state.finaleDone);
  var locked = stopState(s) === "locked";
  b.className = "mark" + (done ? " done" : "") + (locked ? " locked" : "");
  b.disabled  = false;                    // locked stops still explain themselves
  b.innerHTML =
    '<span class="r">' + (s.kind === "study" ? '<i class="pip"></i>' : "") + esc(s.ref) + '</span>' +
    '<span class="l">' + esc(s.label) + '</span>' +
    '<span class="s">' + (done ? "✓ " : "") + esc(stopStatus(s)) + '</span>';
  b.title = s.full + " — " + stopStatus(s);
  b.setAttribute("aria-label", s.full + ". " + stopStatus(s) + (locked ? ". Locked." : ""));
}

/* ----------------------------------------------------------------------------
   The dialog. Standing next to a signpost opens a window at you, which is both
   the thing that tells you what the stop is and the thing you press to enter.
   ---------------------------------------------------------------------------- */
var nearBox, nearShown = null, dismissed = null;

function dialogLine(s){
  var earned = state.done[s.id];
  if(s.kind === "finale"){
    if(state.finaleDone) return "Complete. Run it again with a new plan.";
    return state.tokens >= FINALE.unlockAt
      ? "Ready. Budget: ◈ " + state.tokens + "."
      : "Needs ◈ " + FINALE.unlockAt + ". You have ◈ " + state.tokens + ".";
  }
  if(s.kind === "compare" && !compareReady(s.pair))
    return "Study both halves of the " + s.pair.name.toLowerCase() + " first.";
  if(earned !== undefined) return "Done · ◈ " + earned + " earned. Worth another run.";
  var u = stopUnit(s);
  return u ? u.qs.length + " challenges · up to ◈ " + (u.qs.length * 3) : "";
}

function renderNearBox(s){
  var done   = state.done[s.id] !== undefined || (s.kind === "finale" && state.finaleDone);
  var locked = stopState(s) === "locked";
  var title  = s.kind === "topic"   ? s.ref + " " + s.label
             : s.kind === "study"   ? "Case study"
             : s.kind === "compare" ? "Comparison"
             :                        "Level finale";
  nearBox.className = "dlg" + (done ? " done" : "") + (locked ? " locked" : "");
  nearBox.innerHTML =
    '<div class="dlgbar">' +
      '<span class="dt">' + esc(title.toUpperCase()) + '</span>' +
      '<i aria-hidden="true">–</i><i aria-hidden="true">□</i>' +
      '<button class="dx" aria-label="Dismiss">✕</button>' +
    '</div>' +
    '<div class="dlgbody">' +
      '<p class="dq">' + esc(s.full) + '</p>' +
      '<p class="dm">' + esc(dialogLine(s)) + '</p>' +
      '<button class="dgo"' + (locked ? " disabled" : "") + '>' +
        (locked ? "LOCKED" : done ? "AGAIN" : "OPEN") +
      '</button>' +
    '</div>';
  nearBox.querySelector(".dx").addEventListener("click", function(e){
    e.stopPropagation();
    dismissed = s.id;
    nearBox.hidden = true;
  });
  if(!locked)
    nearBox.querySelector(".dgo").addEventListener("click", function(){ openStop(s); });
}

function placeMarkers(){
  var cam = Math.floor(camX), near = nearestStop();
  for(var i = 0; i < STOPS.length; i++){
    var s = STOPS[i], b = markerEls[i];
    if(!b) continue;
    var px = (s.x - cam) * PX;
    if(px < -220 || px > viewW * PX + 220){ b.style.visibility = "hidden"; continue; }
    b.style.visibility = "visible";
    b.style.left = px + "px";
    var top = (s.y - 22) * PX, h = b.offsetHeight || 58;
    b.style.top = Math.max(h + 4, top) + "px";
    /* the plate steps aside for the dialog when you are standing at it */
    if(near === s && near.id !== dismissed) b.style.visibility = "hidden";
  }

  if(near && near.id !== dismissed){
    if(nearShown !== near.id){ nearShown = near.id; renderNearBox(near); }
    nearBox.hidden = false;
    nearBox.style.left = ((near.x - cam) * PX) + "px";
    var dh = nearBox.offsetHeight || 118;
    nearBox.style.top = Math.max(dh + 4, (near.y - 22) * PX) + "px";
  } else {
    nearBox.hidden = true;
    if(!near) nearShown = null;
  }
  if(!near) dismissed = null;
  var w = document.getElementById("whereNow");
  if(w){
    var txt = near ? (stopState(near) === "locked"
                        ? near.full + " — locked"
                        : "At " + near.full + " · press ↵")
                   : "";
    if(w.textContent !== txt) w.textContent = txt;
  }
}

function nearestStop(){
  for(var i = 0; i < STOPS.length; i++)
    if(Math.abs(STOPS[i].x - hero.x) < 26) return STOPS[i];
  return null;
}

/* Walking the whole course is the game; clicking a signpost is the shortcut. */
function goTo(s){
  hero.x = s.x; hero.y = s.y; hero.vy = 0; hero.ground = true;
  camX = Math.max(0, Math.min(WORLD_W - viewW, hero.x - viewW / 2));
  openStop(s);
}

function openStop(s){
  if(s.kind === "topic")   return openTopic(s.id);
  if(s.kind === "study")   return openStudy(s.id);
  if(s.kind === "compare"){
    if(compareReady(s.pair)) return openCompare(s.id);
    return flash(s, "Study both halves of the " + s.pair.name.toLowerCase() + " to open this comparison.");
  }
  if(s.kind === "finale"){
    if(state.tokens >= FINALE.unlockAt) return openFinale();
    return flash(s, "The finale needs ◈ " + FINALE.unlockAt +
                    ". You have ◈ " + state.tokens + " — revise another topic to earn more.");
  }
}

function flash(s, msg){
  var w = document.getElementById("whereNow");
  if(w){ w.textContent = msg; setTimeout(placeMarkers, 4200); }
}

/* ----------------------------------------------------------------------------
   Input
   ---------------------------------------------------------------------------- */
function gameHasFocus(){
  var a = document.activeElement;
  return !a || a === document.body || stage.contains(a);
}

function bindInput(){
  document.addEventListener("keydown", function(e){
    if(!scrim.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    if(!gameHasFocus()) return;
    var k = e.key;
    if(k === "ArrowLeft"  || k === "a" || k === "A"){ keys.left = 1;  e.preventDefault(); }
    else if(k === "ArrowRight" || k === "d" || k === "D"){ keys.right = 1; e.preventDefault(); }
    else if(k === "ArrowUp" || k === "w" || k === "W" || k === " "){
      if(a === stage || a === document.body){ keys.jump = 1; e.preventDefault(); }
    }
    else if(k === "Enter"){
      if(a === stage || a === document.body){
        var s = nearestStop();
        if(s){ e.preventDefault(); openStop(s); }
      }
    }
  });
  document.addEventListener("keyup", function(e){
    var k = e.key;
    if(k === "ArrowLeft"  || k === "a" || k === "A") keys.left = 0;
    if(k === "ArrowRight" || k === "d" || k === "D") keys.right = 0;
  });
  window.addEventListener("blur", function(){ keys.left = keys.right = 0; });

  /* touch pad — the only way to play without a keyboard */
  Array.prototype.forEach.call(document.querySelectorAll(".pad button"), function(b){
    var k = b.getAttribute("data-key");
    var on  = function(e){ e.preventDefault(); keys[k] = 1; };
    var off = function(e){ e.preventDefault(); if(k !== "jump") keys[k] = 0; };
    b.addEventListener("pointerdown", on);
    b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off);
    b.addEventListener("pointerleave", off);
  });
  if(window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
    document.body.classList.add("touch");

  stage.addEventListener("pointerdown", function(){ stage.focus({ preventScroll:true }); });

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ sizeCanvas(); drawCourse(); placeMarkers(); }, 120);
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopLoop(); else if(scrim.hidden) startLoop();
  });
}

/* ============================================================================
   5. SHELL RENDERING
   ============================================================================ */

function renderHud(){
  document.getElementById("tokCount").textContent = state.tokens;
  var studies = allStudies();
  document.getElementById("topicCount").innerHTML =
    '<span><b>' + doneIn(TOPICS) + '</b> / ' + TOPICS.length + ' topics</span>' +
    '<span><b>' + doneIn(studies) + '</b> / ' + studies.length + ' case studies</span>';

  var note = document.getElementById("unlockNote");
  var ready = state.tokens >= FINALE.unlockAt;
  note.className = "note" + (ready ? " ready" : "");
  if(state.finaleDone)  note.textContent = "Level 1 complete";
  else if(ready)        note.textContent = "Finale unlocked";
  else                  note.textContent = "◈ " + (FINALE.unlockAt - state.tokens) + " to the finale";
}

function renderTabs(){
  var host = document.getElementById("tabs");
  host.innerHTML = "";
  LEVELS.forEach(function(l){
    var t = el("div", "tab" + (l.live ? " live" : " locked"),
      '<span class="n">' + l.n + '</span>' + esc(l.name));
    t.title = l.comp + (l.live ? "" : " — unlocks after Level 1");
    host.appendChild(t);
  });
}

/* The depth ruler says out loud what the level geometry already implies. */
function renderRuler(){
  var host = document.getElementById("ruler");
  host.innerHTML = "";
  [[16, "UPPER ATMOSPHERE"], [56, "STORM BAND"], [SURFACE + 5, "SURFACE"],
   [92, "CRUST"], [107, "MANTLE"]].forEach(function(r){
    var s = el("span", null, r[1]);
    s.style.top = (r[0] * PX) + "px";
    host.appendChild(s);
  });
}

function row(opts){
  var b = el("button", "row" + (opts.done ? " done" : ""),
    '<span class="ref">' + esc(opts.ref) + '</span>' +
    (opts.colour ? '<span class="pip"></span>' : '') +
    '<span class="nm"><b>' + esc(opts.name) + '</b><i>' + esc(opts.sub) + '</i></span>' +
    '<span class="st' + (opts.locked ? ' locked' : '') + '">' + esc(opts.status) + '</span>');
  if(opts.colour) b.style.setProperty("--pair", opts.colour);
  b.disabled = !!opts.disabled;
  if(!opts.disabled) b.addEventListener("click", opts.fn);
  return b;
}

function renderTopics(){
  var host = document.getElementById("topicList");
  host.innerHTML = "";
  TOPICS.forEach(function(t, i){
    var earned = state.done[t.id];
    host.appendChild(row({
      ref:t.ref, name:t.name, sub:t.theme, done:earned !== undefined,
      status:earned !== undefined ? "◈ " + earned + " earned"
                                  : t.qs.length + " challenges · up to ◈ " + (t.qs.length * 3),
      fn:function(){ goTo(STOPS[i]); }
    }));
  });
}

function renderCases(){
  var host = document.getElementById("caseList");
  host.innerHTML = "";
  var at = TOPICS.length;
  PAIRS.forEach(function(pr){
    pr.studies.forEach(function(st){
      var idx = at++, earned = state.done[st.id];
      host.appendChild(row({
        ref:"Case", colour:pr.colour, name:st.name, sub:st.sub + " · " + pr.name,
        done:earned !== undefined,
        status:earned !== undefined ? "◈ " + earned + " earned"
                                    : st.qs.length + " challenges · up to ◈ " + (st.qs.length * 3),
        fn:function(){ goTo(STOPS[idx]); }
      }));
    });
    var cIdx = at++, cmp = pr.compare, ready = compareReady(pr), cEarned = state.done[cmp.id];
    host.appendChild(row({
      ref:"vs", colour:pr.colour, name:cmp.name,
      sub:ready ? "What the pairing proves, once you hold both studies in your head"
                : "Opens when both halves of the " + pr.name.toLowerCase() + " are done",
      done:cEarned !== undefined, locked:!ready, disabled:!ready,
      status:cEarned !== undefined ? "◈ " + cEarned + " earned"
           : ready ? cmp.qs.length + " challenges · up to ◈ " + (cmp.qs.length * 3)
                   : "Locked",
      fn:function(){ goTo(STOPS[cIdx]); }
    }));
  });
}

function renderFinaleCard(){
  var card = document.getElementById("finaleCard");
  var ready = state.tokens >= FINALE.unlockAt;
  card.className = "finale" + (ready ? " ready" : "");
  var pct = Math.min(100, Math.round(state.tokens / FINALE.unlockAt * 100));

  if(state.finaleDone && state.finaleResult){
    card.innerHTML =
      '<div class="ft"><h3>LEVEL 1 COMPLETE — ' + esc(state.finaleResult.tier.toUpperCase()) + '</h3>' +
      '<p>Your management plan saved lives in the simulated event. Run the finale again to try a ' +
      'different allocation, or revise any topic to earn more tokens first.</p></div>';
    var again = el("button", "btn primary", "Run the finale again");
    again.addEventListener("click", openFinale);
    card.appendChild(again);
    return;
  }

  card.innerHTML =
    '<div class="ft"><h3>LEVEL FINALE — ' + esc(FINALE.title.toUpperCase()) + '</h3>' +
    '<p>Spend your tokens as a hazard-management budget, then live with the consequences. ' +
    'It takes ◈ ' + FINALE.unlockAt + ' to begin, and the more you bring the more of the region ' +
    'you can protect.</p>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  var go = el("button", "btn primary", ready ? "Begin the finale" : "◈ " + state.tokens + " / " + FINALE.unlockAt);
  go.disabled = !ready;
  go.addEventListener("click", openFinale);
  card.appendChild(go);
}

function renderAll(){
  renderHud();
  renderTabs();
  renderCases();
  renderTopics();
  renderFinaleCard();
  nearShown = null;
  for(var i = 0; i < STOPS.length; i++) if(markerEls[i]) updateMarker(markerEls[i], STOPS[i]);
}

/* ============================================================================
   6. MODAL PLUMBING
   ============================================================================ */

var scrim = document.getElementById("scrim");

function openModal(loc, title){
  document.getElementById("mLoc").textContent   = loc;
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mProg").textContent  = "";
  document.getElementById("mBody").innerHTML    = "";
  document.getElementById("mFoot").innerHTML    = "";
  scrim.hidden = false;
  scrim.scrollTop = 0;
  stopLoop();
}
function closeModal(){
  scrim.hidden = true;
  renderAll();
  stage.focus({ preventScroll:true });
  startLoop();
}

document.getElementById("mClose").addEventListener("click", closeModal);
scrim.addEventListener("click", function(e){ if(e.target === scrim) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !scrim.hidden) closeModal(); });

function foot(buttons){
  var f = document.getElementById("mFoot");
  f.innerHTML = "";
  buttons.forEach(function(b){
    if(b === null){ f.appendChild(el("div","sp")); return; }
    var n = el("button","btn"+(b.primary?" primary":b.ghost?" ghost":""), b.label);
    n.disabled = !!b.disabled;
    n.addEventListener("click", b.fn);
    f.appendChild(n);
  });
}

/* ============================================================================
   7. CHALLENGE ENGINE
   Scoring: right first time = 3 tokens · after a hint = 2 · after a retry = 1
   ============================================================================ */

var run = null;   // { unit, kind, i, earned, hinted, tries, answered }

/* All three kinds of unit run through the same engine; only the briefing and
   the modal header differ. `kind` is "topic", "study" or "compare". */
function startRun(unit, kind, loc){
  if(!unit) return;
  run = { unit:unit, kind:kind, i:0, earned:0, hinted:false, tries:0, answered:false };
  openModal(loc, unit.name);
  showBrief();
}

function openTopic(id){
  var t = topicById(id);
  if(t) startRun(t, "topic", "Topic " + t.ref);
}
function openStudy(id){
  var st = studyById(id);
  if(!st) return;
  var pr = pairOfStudy(id);
  startRun(st, "study", "Case study · " + (pr ? pr.name : ""));
}
function openCompare(id){
  var cmp = compareById(id);
  if(cmp) startRun(cmp, "compare", "Linked comparison");
}

function showBrief(){
  var unit = run.unit, body = document.getElementById("mBody");
  var head = run.kind === "topic" ? "Topic briefing"
           : run.kind === "study" ? "Case study briefing"
           : "Comparison briefing";

  var html = '<div class="brief"><h4>'+head+'</h4><p>'+esc(unit.brief)+'</p>';
  if(unit.facts) html += '<div class="facts">'+unit.facts.map(function(f){
      return "<span>"+esc(f)+"</span>"; }).join("")+'</div>';
  if(unit.keys)  html += '<div class="facts">'+unit.keys.map(function(f){
      return "<span>"+esc(f)+"</span>"; }).join("")+'</div>';
  html += '</div>';

  if(run.kind === "study"){
    var pr = pairOfStudy(unit.id);
    if(pr){
      var other = pr.studies.filter(function(st){ return st.id !== unit.id; })[0];
      html += '<p class="linknote">Linked with <b>'+esc(other.name)+'</b> ('+esc(other.sub)+'). '+
              'Do both and the comparison unlocks.</p>';
    }
  }

  html += '<p style="color:var(--muted);font-size:13.5px;margin:0">'+
    '<b style="color:var(--ink)">'+unit.qs.length+' challenges</b>'+
    (unit.theme ? ' · '+esc(unit.theme) : '')+'<br>'+
    'Every challenge is worth <b style="color:var(--tok)">◈ 3</b>. Each hint or mistake costs one token. '+
    'You always get the full explanation afterwards, right or wrong.</p>';

  body.innerHTML = html;
  document.getElementById("mProg").textContent = "";

  var again = state.done[unit.id] !== undefined;
  var verb  = run.kind === "topic" ? (again ? "Revise again"  : "Begin topic")
            : run.kind === "study" ? (again ? "Study again"   : "Begin case study")
            :                        (again ? "Compare again" : "Begin comparison");
  foot([ { label:"Close", fn:closeModal, ghost:true }, null,
         { label:verb, fn:nextQuestion, primary:true } ]);
}

function nextQuestion(){
  if(run.i >= run.unit.qs.length) return showSummary();
  run.hinted = false; run.tries = 0; run.answered = false;
  document.getElementById("mProg").textContent = "Challenge " + (run.i+1) + " of " + run.unit.qs.length;
  renderQuestion(run.unit.qs[run.i]);
}

var TYPE_LABEL = { mcq:"Multiple choice", order:"Sequencing", match:"Matching pairs",
                   label:"Label the diagram", data:"Data response", exam:"Exam question" };

function renderQuestion(q){
  var body = document.getElementById("mBody");
  body.innerHTML = "";
  body.appendChild(el("div","qtype", TYPE_LABEL[q.t] || ""));

  var buttons = [];
  if(q.hint) buttons.push({ label:"Hint (◈ −1)", fn:showHint, ghost:true });
  buttons.push(null);
  buttons.push({ label:"Skip", fn:function(){ finishQuestion(0, true); }, ghost:true });
  foot(buttons);

  if(q.t === "mcq")        renderMcq(q, body);
  else if(q.t === "data")  renderData(q, body);
  else if(q.t === "order") renderOrder(q, body);
  else if(q.t === "match") renderMatch(q, body);
  else if(q.t === "label") renderLabel(q, body);
  else if(q.t === "exam")  renderExam(q, body);
}

function showHint(){
  if(run.answered) return;
  var q = run.unit.qs[run.i];
  if(!q.hint || run.hinted) return;
  run.hinted = true;
  var body = document.getElementById("mBody");
  var f = el("div","fb hint","<b>Hint.</b> " + esc(q.hint));
  body.appendChild(f);
  f.scrollIntoView({ block:"nearest" });
  var btns = document.getElementById("mFoot").querySelectorAll("button");
  if(btns.length) btns[0].disabled = true;
}

/* tokens for the current question, given how it went */
function tokensFor(){
  if(run.tries <= 1) return run.hinted ? 2 : 3;
  return 1;
}

/* Show the explanation and move on. */
function finishQuestion(tokens, skipped, markLine){
  run.answered = true;
  var q = run.unit.qs[run.i];
  var body = document.getElementById("mBody");

  var box = el("div","fb " + (tokens > 0 ? "ok" : "no"));
  var lead = markLine ? "You awarded yourself " + markLine + "."
           : skipped  ? "Skipped."
           : tokens > 0 ? "Correct." : "Not quite.";
  box.innerHTML = "<b>" + esc(lead) + "</b> " + esc(q.why) +
                  (tokens > 0 ? '<div class="earn">◈ +' + tokens + ' tokens</div>'
                              : '<div class="earn" style="color:var(--dim)">◈ +0 tokens</div>');
  body.appendChild(box);
  box.scrollIntoView({ block:"nearest" });

  run.earned += tokens;
  state.tokens += tokens;
  save();
  document.getElementById("tokCount").textContent = state.tokens;

  run.i++;
  foot([ { label:"Close", fn:closeModal, ghost:true }, null,
         { label: run.i >= run.unit.qs.length ? "See results" : "Next challenge",
           fn: run.i >= run.unit.qs.length ? showSummary : nextQuestion, primary:true } ]);
}

function showSummary(){
  var unit = run.unit;
  var best = state.done[unit.id];
  state.done[unit.id] = (best === undefined) ? run.earned : Math.max(best, run.earned);
  save();

  var max = unit.qs.length * 3;
  var body = document.getElementById("mBody");
  document.getElementById("mProg").textContent = "";
  body.innerHTML =
    '<div class="sum"><div class="big">◈ '+run.earned+'</div>'+
    '<div class="cap">earned here, out of a possible '+max+'</div>'+
    '<div class="line">Total tokens: <b style="color:var(--tok)">◈ '+state.tokens+'</b>' +
    (state.tokens >= FINALE.unlockAt
      ? ' — enough to attempt the level finale.'
      : ' — you need ◈ '+FINALE.unlockAt+' to attempt the finale.') +
    '</div></div>';
  var retry = run.kind === "topic" ? function(){ openTopic(unit.id); }
            : run.kind === "study" ? function(){ openStudy(unit.id); }
            :                        function(){ openCompare(unit.id); };
  foot([ { label:"Try again", fn:retry, ghost:true }, null,
         { label:"Back", fn:closeModal, primary:true } ]);
}

/* ---- multiple choice ---------------------------------------------------- */

function renderMcq(q, body, prefixHtml){
  if(prefixHtml) body.insertAdjacentHTML("beforeend", prefixHtml);
  body.appendChild(el("div","qtext", esc(q.q)));

  var wrap = el("div","opts");
  var letters = "ABCD".split("");
  q.opts.forEach(function(text, idx){
    var b = el("button","opt", '<span class="k">'+(letters[idx]||"")+'</span>'+esc(text));
    b.addEventListener("click", function(){
      if(run.answered) return;
      var all = wrap.querySelectorAll(".opt");
      if(idx === q.a){
        b.classList.add("correct");
        Array.prototype.forEach.call(all, function(n){ n.disabled = true; });
        finishQuestion(tokensNow());
      } else {
        run.tries++;
        b.classList.add("wrong");
        b.disabled = true;
        if(run.tries >= 3){
          all[q.a].classList.add("correct");
          Array.prototype.forEach.call(all, function(n){ n.disabled = true; });
          finishQuestion(0);
        }
      }
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
}

/* tokens available right now: 3, minus one per mistake, minus one for a hint */
function tokensNow(){
  return Math.max(0, 3 - run.tries - (run.hinted ? 1 : 0));
}

/* ---- data response ------------------------------------------------------ */

function renderData(q, body){
  renderMcq(q, body, chartHtml(q.chart));
}

function chartHtml(c){
  var h = '<div class="chart"><div class="ct">'+esc(c.title)+'</div><div class="cs">'+esc(c.sub)+'</div>';

  if(c.kind === "table"){
    h += '<div style="overflow-x:auto"><table class="data"><thead><tr>';
    c.headers.forEach(function(x){ h += '<th>'+esc(x)+'</th>'; });
    h += '</tr></thead><tbody>';
    c.rows.forEach(function(r){
      h += '<tr>';
      r.forEach(function(x){ h += '<td>'+esc(x)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  else if(c.kind === "bars"){
    var globalMax = 0;
    c.series.forEach(function(s){ if(s.value > globalMax) globalMax = s.value; });
    c.series.forEach(function(s){
      var max = s.of || globalMax;
      var pct = Math.max(2, Math.round(s.value / max * 100));
      h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'+
             '<div style="flex:0 0 40%;font-size:12.5px;color:var(--muted)">'+esc(s.label)+'</div>'+
             '<div style="flex:1;height:16px;background:#ded6f5;border-radius:5px;overflow:hidden">'+
               '<i style="display:block;height:100%;width:'+pct+'%;background:'+s.colour+'"></i></div>'+
             '<div style="flex:0 0 68px;text-align:right;font-weight:700;font-size:12.5px;'+
                  'font-variant-numeric:tabular-nums">'+esc(s.display)+'</div>'+
           '</div>';
    });
  }

  else if(c.kind === "line"){
    var W = 560, H = 240, L = 52, R = 542, T = 16, B = 196;
    var px = function(x){
      var t = (x - c.xmin) / (c.xmax - c.xmin);
      if(c.xflip) t = 1 - t;
      return L + t * (R - L);
    };
    var py = function(y){ return B - (y - c.ymin) / (c.ymax - c.ymin) * (B - T); };

    h += '<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto">';
    var i, v;
    for(i = 0; i <= 4; i++){                       // horizontal gridlines
      v = c.ymin + (c.ymax - c.ymin) * i / 4;
      h += '<line x1="'+L+'" y1="'+py(v).toFixed(1)+'" x2="'+R+'" y2="'+py(v).toFixed(1)+
           '" stroke="#c4bde0" stroke-width="1"/>'+
           '<text x="'+(L-8)+'" y="'+(py(v)+4).toFixed(1)+'" fill="#5c5480" font-size="10" text-anchor="end">'+
           Math.round(v)+'</text>';
    }
    for(i = 0; i <= 4; i++){                       // x-axis ticks
      v = c.xmin + (c.xmax - c.xmin) * i / 4;
      h += '<text x="'+px(v).toFixed(1)+'" y="'+(B+18)+'" fill="#5c5480" font-size="10" text-anchor="middle">'+
           Math.round(v)+'</text>';
    }
    c.series.forEach(function(s){
      var d = s.points.map(function(p, k){
        return (k ? "L" : "M") + px(p[0]).toFixed(1) + " " + py(p[1]).toFixed(1);
      }).join(" ");
      h += '<path d="'+d+'" fill="none" stroke="'+s.colour+'" stroke-width="2" '+
           'stroke-linejoin="round" stroke-linecap="round"/>';
    });
    h += '<text x="'+((L+R)/2)+'" y="'+(H-4)+'" fill="#5c5480" font-size="10.5" text-anchor="middle">'+
         esc(c.xlab)+'</text>';
    h += '<text x="14" y="'+((T+B)/2)+'" fill="#5c5480" font-size="10.5" text-anchor="middle" '+
         'transform="rotate(-90 14 '+((T+B)/2)+')">'+esc(c.ylab)+'</text>';
    h += '</svg>';
  }

  return h + '</div>';
}

/* ---- sequencing --------------------------------------------------------- */

function renderOrder(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));
  var hint = el("div","", "Click them in the correct order.");
  hint.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(hint);

  var wrap = el("div","seq");
  var placed = 0;
  var order = shuffle(q.items);

  order.forEach(function(text){
    var correctIndex = q.items.indexOf(text);
    var b = el("button","step", '<span class="num">·</span><span>'+esc(text)+'</span>');
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("picked")) return;
      if(correctIndex === placed){
        placed++;
        b.classList.remove("bad");
        b.classList.add("picked");
        b.querySelector(".num").textContent = placed;
        if(placed === q.items.length) finishQuestion(tokensNow());
      } else {
        run.tries++;
        b.classList.add("bad");
        setTimeout(function(){ b.classList.remove("bad"); }, 550);
        if(run.tries >= 3) revealOrder(wrap, q);
      }
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
}

function revealOrder(wrap, q){
  wrap.innerHTML = "";
  q.items.forEach(function(text, i){
    var n = el("div","step picked", '<span class="num">'+(i+1)+'</span><span>'+esc(text)+'</span>');
    wrap.appendChild(n);
  });
  finishQuestion(0);
}

/* ---- matching pairs ----------------------------------------------------- */

function renderMatch(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));
  var tip = el("div","", "Click a term, then click its definition.");
  tip.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(tip);

  var grid = el("div","match");
  var colL = el("div","col", '<div class="ch">Term</div>');
  var colR = el("div","col", '<div class="ch">Meaning</div>');
  var left = shuffle(q.pairs), right = shuffle(q.pairs);
  var selected = null, remaining = q.pairs.length;

  function clearSel(){
    if(selected){ selected.node.classList.remove("sel"); selected = null; }
  }
  function flash(n){
    n.classList.add("flash");
    setTimeout(function(){ n.classList.remove("flash"); }, 480);
  }

  left.forEach(function(p){
    var b = el("button","mi", esc(p[0]));
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("gone")) return;
      clearSel();
      selected = { key:p[0], node:b };
      b.classList.add("sel");
    });
    colL.appendChild(b);
  });

  right.forEach(function(p){
    var b = el("button","mi", esc(p[1]));
    b.addEventListener("click", function(){
      if(run.answered || b.classList.contains("gone")) return;
      if(!selected){ flash(b); return; }
      if(selected.key === p[0]){
        selected.node.classList.add("gone");
        selected.node.classList.remove("sel");
        b.classList.add("gone");
        selected = null;
        remaining--;
        if(remaining === 0) finishQuestion(tokensNow());
      } else {
        run.tries++;
        flash(b); flash(selected.node);
        clearSel();
        if(run.tries >= 3) revealMatch(grid, q);
      }
    });
    colR.appendChild(b);
  });

  grid.appendChild(colL); grid.appendChild(colR);
  body.appendChild(grid);
}

function revealMatch(grid, q){
  grid.className = "";
  grid.innerHTML = q.pairs.map(function(p){
    return '<div class="mi gone" style="margin-bottom:8px"><b style="color:var(--ink)">'+
           esc(p[0])+'</b> — '+esc(p[1])+'</div>';
  }).join("");
  finishQuestion(0);
}

/* ---- label the diagram -------------------------------------------------- */

function renderLabel(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));

  var host = el("div","diagram", DIAGRAMS[q.diagram]());
  body.appendChild(host);

  var promptBox = el("div","fb hint");
  body.appendChild(promptBox);

  var step = 0;
  function ask(){
    if(step >= q.targets.length){ finishQuestion(tokensNow()); return; }
    promptBox.innerHTML = "<b>" + (step+1) + " of " + q.targets.length + ".</b> " + esc(q.targets[step].prompt);
  }

  Array.prototype.forEach.call(host.querySelectorAll(".hot"), function(h){
    h.addEventListener("click", function(){
      if(run.answered || h.classList.contains("got")) return;
      if(h.getAttribute("data-id") === q.targets[step].id){
        h.classList.add("got");
        step++;
        ask();
      } else {
        run.tries++;
        h.classList.add("miss");
        setTimeout(function(){ h.classList.remove("miss"); }, 520);
        if(run.tries >= 3){
          q.targets.forEach(function(t){
            var n = host.querySelector('[data-id="'+t.id+'"]');
            if(n) n.classList.add("got");
          });
          promptBox.innerHTML = "<b>Revealed.</b> The labelled features are highlighted above.";
          finishQuestion(0);
        }
      }
    });
  });
  ask();
}

/* ---- exam question, marked against an Edexcel-style scheme ----------------
   Two kinds, matching the paper:
     marks:4 — point-marked. Each reason earns 1 mark, and a second mark only
               where a reason is actually given. A bare statement scores 1.
     marks:8 — levels-based. You place your answer in a level, then award a
               mark within that band.
   -------------------------------------------------------------------------- */

function renderExam(q, body){
  body.appendChild(el("div","qtext", esc(q.q)));

  var note = el("div","", q.marks === 8
    ? "Write your answer as you would in the exam, then reveal the levels and place your own answer honestly."
    : "Write your answer as you would in the exam, then reveal the mark scheme and mark yourself honestly.");
  note.style.cssText = "font-size:12.5px;color:var(--dim);margin:-8px 0 12px";
  body.appendChild(note);

  var ta = el("textarea","exam");
  ta.placeholder = "Your answer (" + q.marks + " marks)…";
  body.appendChild(ta);

  foot([ null, { label:"Reveal mark scheme", primary:true, fn:reveal } ]);

  function reveal(){
    if(run.answered) return;
    ta.disabled = true;
    var box = (q.marks === 8) ? levelsScheme(q) : pointsScheme(q);
    body.appendChild(box.node);
    box.node.scrollIntoView({ block:"nearest" });

    foot([ null, { label:"Score my answer", primary:true, fn:function(){
      var awarded = Math.min(q.marks, box.awarded());
      box.lock();
      var ratio = awarded / q.marks;
      var tok = ratio >= 0.75 ? 3 : ratio >= 0.5 ? 2 : awarded > 0 ? 1 : 0;
      finishQuestion(tok, false, awarded + " / " + q.marks + " marks");
    }}]);
  }
}

/* -- 4 marks: point + reason, the reason only creditable once the point stands -- */
function pointsScheme(q){
  var node = el("div","scheme");
  node.innerHTML =
    '<h4>Mark scheme — '+q.marks+' marks</h4>'+
    '<div class="note">'+esc(q.guidance ||
      "Award 1 mark for each valid reason identified, and a further 1 mark where that reason is "+
      "developed with an explanation. A point stated without a reason scores 1 mark only. "+
      "Credit a maximum of "+(q.marks/2)+" developed reasons.")+'</div>'+
    '<div class="tally">Marks so far <b>0</b> / '+q.marks+'</div>';

  var tally = node.querySelector(".tally b");
  var rows  = [];

  q.scheme.forEach(function(pt){
    var row = el("div","pr");
    row.innerHTML =
      '<label class="p"><input type="checkbox"><span><i>1</i>'+esc(pt.p)+'</span></label>'+
      '<label class="r"><input type="checkbox" disabled><span><i>1</i>'+esc(pt.r)+'</span></label>';
    var pi = row.querySelector(".p input");
    var ri = row.querySelector(".r input");
    var rl = row.querySelector(".r");
    pi.addEventListener("change", function(){
      /* no development mark without the point it develops */
      if(!pi.checked){ ri.checked = false; }
      ri.disabled = !pi.checked;
      rl.classList.toggle("off", !pi.checked);
      count();
    });
    ri.addEventListener("change", count);
    rl.classList.add("off");
    rows.push({ p:pi, r:ri });
    node.appendChild(row);
  });

  function raw(){
    var n = 0;
    rows.forEach(function(r){ if(r.p.checked) n++; if(r.r.checked) n++; });
    return n;
  }
  function count(){
    var n = Math.min(q.marks, raw());
    tally.textContent = n;
    tally.parentNode.classList.toggle("full", n >= q.marks);
  }

  return {
    node: node,
    awarded: raw,
    lock: function(){
      Array.prototype.forEach.call(node.querySelectorAll("input"), function(n){ n.disabled = true; });
    }
  };
}

/* -- 8 marks: levels, then a mark inside the band you chose -- */
function levelsScheme(q){
  var node = el("div","scheme");
  var html =
    '<h4>Mark scheme — '+q.marks+' marks, levels of response</h4>'+
    '<div class="note">'+esc(q.guidance ||
      "Read the level descriptors, decide which one your answer as a whole reaches, "+
      "then award a mark within that band. An answer with no supported judgement cannot reach Level 3.")+'</div>';

  if(q.indicative && q.indicative.length){
    html += '<div class="ind"><h5>Indicative content</h5><ul>'+
            q.indicative.map(function(i){ return "<li>"+esc(i)+"</li>"; }).join("")+
            '</ul><div class="cav">This is not a checklist — credit any valid, well-supported response.</div></div>';
  }
  node.innerHTML = html;

  var chosen = null;
  var marks  = el("div","markpick");
  marks.hidden = true;

  q.levels.forEach(function(lv, i){
    var lab = el("label","lv",
      '<input type="radio" name="lvl"><span><b>'+esc(lv.band)+'</b>'+esc(lv.d)+'</span>');
    lab.querySelector("input").addEventListener("change", function(){
      chosen = null;
      markPicked(lab);
      marks.innerHTML = '<span class="ml">Award yourself</span>';
      for(var m = lv.lo; m <= lv.hi; m++){
        (function(mk){
          var b = el("button","mk", mk + (mk === 1 ? " mark" : " marks"));
          b.addEventListener("click", function(){
            chosen = mk;
            Array.prototype.forEach.call(marks.querySelectorAll(".mk"), function(n){
              n.classList.remove("on");
            });
            b.classList.add("on");
          });
          marks.appendChild(b);
        })(m);
      }
      marks.hidden = false;
    });
    node.appendChild(lab);
  });

  var zero = el("label","lv", '<input type="radio" name="lvl"><span><b>0 marks</b>No rewardable material.</span>');
  zero.querySelector("input").addEventListener("change", function(){
    chosen = 0; marks.hidden = true; markPicked(zero);
  });

  function markPicked(lab){
    Array.prototype.forEach.call(node.querySelectorAll("label.lv"), function(n){
      n.classList.toggle("picked", n === lab);
    });
  }
  node.appendChild(zero);
  node.appendChild(marks);

  return {
    node: node,
    awarded: function(){ return chosen === null ? 0 : chosen; },
    lock: function(){
      Array.prototype.forEach.call(node.querySelectorAll("input,button"), function(n){ n.disabled = true; });
    }
  };
}

function openFinale(){
  var bought = {};
  var spent  = 0;
  var budget = state.tokens;

  openModal("Level 1 finale", FINALE.title);
  var body = document.getElementById("mBody");

  function totals(){
    var t = { lives:0, econ:0, recov:0 };
    FINALE.cats.forEach(function(c){
      c.items.forEach(function(it){
        if(bought[it.id]){ t.lives += it.lives; t.econ += it.econ; t.recov += it.recov; }
      });
    });
    FINALE.synergies.forEach(function(s){
      if(s.needs.every(function(id){ return bought[id]; })){ t.lives += s.lives; t.recov += s.recov; }
    });
    return t;
  }

  function draw(){
    body.innerHTML = "";
    body.insertAdjacentHTML("beforeend",
      '<div class="brief"><h4>Your assignment</h4><p>'+esc(FINALE.brief)+'</p></div>');

    var bar = el("div","budget",
      '<div><div class="lab">Budget remaining</div><div class="amt">◈ '+(budget-spent)+'</div></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="lab">Committed</div>'+
      '<div class="amt" style="color:var(--gold)">◈ '+spent+'</div></div>');
    body.appendChild(bar);

    FINALE.cats.forEach(function(c){
      var cat = el("div","cat", '<h4>'+esc(c.name)+'</h4><div class="cd">'+esc(c.desc)+'</div>');
      c.items.forEach(function(it){
        var on   = !!bought[it.id];
        var poor = !on && it.cost > (budget - spent);
        var b = el("button","buy"+(on?" on":""),
          '<div><div class="bn">'+esc(it.n)+'</div><div class="bd">'+esc(it.d)+'</div></div>'+
          '<div class="cost">◈ '+it.cost+'</div>');
        b.disabled = poor;
        b.addEventListener("click", function(){
          if(bought[it.id]){ delete bought[it.id]; spent -= it.cost; }
          else if(it.cost <= budget - spent){ bought[it.id] = true; spent += it.cost; }
          draw();
        });
        cat.appendChild(b);
      });
      body.appendChild(cat);
    });

    foot([ { label:"Back to the course", fn:closeModal, ghost:true }, null,
           { label:"Commit the plan", primary:true, disabled:spent === 0,
             fn:function(){ resolve(bought, spent, budget); } } ]);
  }

  draw();
}

function resolve(bought, spent, budget){
  var t = { lives:0, econ:0, recov:0 };
  var chosen = [];
  FINALE.cats.forEach(function(c){
    c.items.forEach(function(it){
      if(bought[it.id]){
        t.lives += it.lives; t.econ += it.econ; t.recov += it.recov;
        chosen.push({ cat:c.name, item:it });
      }
    });
  });

  var fired = [];
  FINALE.synergies.forEach(function(s){
    if(s.needs.every(function(id){ return bought[id]; })){
      t.lives += s.lives; t.recov += s.recov; fired.push(s);
    }
  });

  /* maxima, so the simulated outcome scales sensibly */
  var MAX = { lives:135, econ:79, recov:67 };
  var lp = Math.min(1, t.lives / MAX.lives);
  var ep = Math.min(1, t.econ  / MAX.econ);
  var rp = Math.min(1, t.recov / MAX.recov);

  var deaths   = Math.max(20, Math.round(2400 * (1 - lp) / 10) * 10);
  var loss     = Math.max(1.2, Math.round((11 - 9 * ep) * 10) / 10);
  var recovery = Math.max(8, Math.round(64 - 50 * rp));

  var tier, medal, tagline;
  if(lp >= 0.72)      { tier = "Gold — a model response"; medal = "🥇";
                        tagline = "Independent reviewers describe the region as one of the best-prepared in the world."; }
  else if(lp >= 0.48) { tier = "Silver — a solid plan"; medal = "🥈";
                        tagline = "The region coped, but clear gaps in the plan cost lives that better allocation would have saved."; }
  else if(lp >= 0.25) { tier = "Bronze — partial protection"; medal = "🥉";
                        tagline = "Some measures worked, but the response was overwhelmed in the worst-affected districts."; }
  else                { tier = "The plan failed"; medal = "⚠️";
                        tagline = "Too little was in place. This is what a hazard becoming a disaster looks like."; }

  var gaps = FINALE.gaps.filter(function(g){ return g.when(bought); });

  var html = '<div class="outcome"><div class="medal">'+medal+'</div><h2>'+esc(tier)+'</h2>'+
             '<div class="tag">'+esc(tagline)+'</div></div>';

  html += '<div class="stats">'+
    '<div class="stat"><div class="v" style="color:var(--bad)">'+deaths.toLocaleString()+'</div><div class="l">Deaths</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--gold)">$'+loss+'bn</div><div class="l">Economic loss</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--tok)">'+recovery+'</div><div class="l">Months to recover</div></div>'+
    '</div>';

  html += '<div class="debrief">';
  html += '<h4>What your budget bought</h4><ul>';
  if(!chosen.length) html += '<li>Nothing was funded, so the region faced the earthquake entirely unprepared.</li>';
  chosen.forEach(function(c){
    html += '<li><b>'+esc(c.item.n)+'</b> <span style="color:var(--dim)">('+esc(c.cat)+', ◈ '+c.item.cost+')</span> — '+esc(c.item.d)+'</li>';
  });
  html += '</ul>';

  if(fired.length){
    html += '<h4>Choices that worked together</h4><ul>';
    fired.forEach(function(s){ html += '<li>'+esc(s.note)+'</li>'; });
    html += '</ul>';
  }

  if(gaps.length){
    html += '<h4>What your plan left exposed</h4><ul>';
    gaps.forEach(function(g){ html += '<li>'+esc(g.text)+'</li>'; });
    html += '</ul>';
  }

  var left = budget - spent;
  html += '<h4>The examiner’s note</h4><ul>'+
          '<li>You committed <b>◈ '+spent+'</b> of <b>◈ '+budget+'</b>'+
          (left > 0 ? ', leaving ◈ '+left+' unspent. Unspent resources protect nobody — but nor does spreading a budget so thinly that nothing is finished.' : ', spending everything available.')+'</li>'+
          '<li>Notice the pattern: <b>protection and preparation saved the most lives</b>, while prediction on its own bought very little. '+
          'That is the argument to make in an exam answer about managing tectonic hazards.</li>'+
          '<li>Every real government faces this trade-off. Chile spent decades on building codes and lost around 525 people to a magnitude 8.8 earthquake. '+
          'Nepal could not afford to, and lost around 8,900 to a magnitude 7.8.</li>'+
          '</ul></div>';

  document.getElementById("mBody").innerHTML = html;
  document.getElementById("mProg").textContent = "";

  state.finaleDone = true;
  state.finaleResult = { tier:tier, deaths:deaths, loss:loss, recovery:recovery };
  save();

  foot([ { label:"Try a different plan", ghost:true, fn:openFinale }, null,
         { label:"Back to the course", primary:true, fn:closeModal } ]);
}

   10. BOOT

stage       = document.getElementById("stage");
cv          = document.getElementById("world");
markerHost  = document.getElementById("markers");
nearBox     = document.getElementById("nearBox");

document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("Wipe all progress and start Level 1 again?")) return;
  state = { tokens:0, done:{}, finaleDone:false, finaleResult:null };
  save();
  hero.x = STOPS[0].x; hero.y = STOPS[0].y; hero.vy = 0; hero.ground = true;
  camX = 0;
  renderAll();
});

load();
buildCourse();
sizeCanvas();
renderRuler();
renderMarkers();
renderAll();
bindInput();
hero.x = STOPS[0].x;
hero.y = STOPS[0].y;
camX   = Math.max(0, Math.min(WORLD_W - viewW, hero.x - viewW / 2));
startLoop();

</script>
